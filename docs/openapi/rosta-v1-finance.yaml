openapi: 3.1.0
info:
  title: Rosta Refund and Financial Reconciliation API
  version: 2026-08-28-ps4b
  description: Administrator-only financial policy, refund, payout evidence and reconciliation workflows.
servers:
  - url: https://api-staging.rosta.shop/api/v1
security:
  - sanctumSession: []
paths:
  /admin/finance/refunds:
    get:
      operationId: listRefundAttempts
      responses:
        "200": { description: Paginated refund attempts }
        "403": { description: Administrator role required }
  /admin/finance/reconciliation:
    get:
      operationId: listFinancialReconciliationCases
      responses:
        "200": { description: Paginated financial reconciliation cases }
        "403": { description: Administrator role required }
  /admin/finance/policies:
    get:
      operationId: listFinancialPolicies
      responses:
        "200": { description: Versioned tax and commission policies with rules and lifecycle state }
  /admin/finance/tax-policies:
    post:
      operationId: createTaxPolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxPolicyInput" }
      responses:
        "201": { description: Tax policy draft created; no rate is inferred by the server }
  /admin/finance/tax-policies/{policyId}:
    patch:
      operationId: updateTaxPolicyDraft
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxPolicyInput" }
      responses:
        "200": { description: Draft replaced }
        "409": { description: Submitted and published versions are immutable }
  /admin/finance/tax-policies/{policyId}/submit:
    post:
      operationId: submitTaxPolicy
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      responses:
        "200": { description: Draft submitted for independent approval }
  /admin/finance/tax-policies/{policyId}/publish:
    post:
      operationId: publishTaxPolicy
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      responses:
        "200": { description: Effective-dated immutable version published with checksum }
        "409": { description: Author/publisher dual-control or effective-range overlap violation }
  /admin/finance/commission-policies:
    post:
      operationId: createCommissionPolicyDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionPolicyInput" }
      responses:
        "201": { description: Commission policy draft created; no rate is inferred by the server }
  /admin/finance/commission-policies/{policyId}:
    patch:
      operationId: updateCommissionPolicyDraft
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionPolicyInput" }
      responses:
        "200": { description: Draft replaced }
        "409": { description: Submitted and published versions are immutable }
  /admin/finance/commission-policies/{policyId}/submit:
    post:
      operationId: submitCommissionPolicy
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      responses:
        "200": { description: Draft submitted for independent approval }
  /admin/finance/commission-policies/{policyId}/publish:
    post:
      operationId: publishCommissionPolicy
      parameters: [{ $ref: "#/components/parameters/PolicyId" }]
      responses:
        "200": { description: Effective-dated immutable version published with checksum }
        "409": { description: Author/publisher dual-control or effective-range overlap violation }
  /admin/orders/{orderId}/refunds:
    post:
      operationId: requestOrderRefund
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRefundRequest" }
      responses:
        "201": { description: Refund request persisted or idempotently replayed }
        "409": { description: No verified payment, idempotency conflict or amount exceeds refundable balance }
  /admin/refunds/{refundId}/approve:
    post:
      operationId: approveRefund
      parameters:
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200": { description: Refund approved under dual-control policy }
        "409": { description: Invalid state or dual-control violation }
  /admin/refunds/{refundId}/dispatch:
    post:
      operationId: dispatchRefund
      parameters:
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200": { description: Provider dispatch completed, pending or safely replayed }
        "503": { description: Refund provider disabled or unavailable }
  /admin/refunds/{refundId}/resolve:
    post:
      operationId: resolveManualRefund
      parameters:
        - $ref: "#/components/parameters/RefundId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveRefundRequest" }
      responses:
        "200": { description: Manual provider outcome recorded }
        "409": { description: Refund is not awaiting manual resolution }
  /admin/finance/reconciliation/{caseId}:
    patch:
      operationId: resolveFinancialReconciliationCase
      parameters:
        - $ref: "#/components/parameters/CaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveCaseRequest" }
      responses:
        "200": { description: Reconciliation case resolved or dismissed }
  /admin/finance/settlement-batches:
    get:
      operationId: listSettlementBatches
      responses:
        "200": { description: Paginated roastery settlement batches }
    post:
      operationId: createSettlementBatch
      responses:
        "201": { description: Eligible roastery allocations attached exactly once }
        "409": { description: No eligible allocation or idempotency conflict }
  /admin/finance/settlement-batches/{batchId}/resolve:
    post:
      operationId: resolveSettlementBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveSettlementBatchRequest" }
      responses:
        "200": { description: Batch moved to processing, requires-review, paid or failed }
        "409": { description: Invalid transition, dual-control violation, replay conflict or evidence mismatch }
        "422": { description: Required payout/failure evidence is missing or invalid }
  /admin/sub-orders/{subOrderId}/settlement-hold:
    post:
      operationId: setSubOrderSettlementHold
      parameters:
        - name: subOrderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Settlement hold set or released before batching }
        "409": { description: Allocation already belongs to a settlement batch }
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: rosta_session
  parameters:
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    RefundId: { name: refundId, in: path, required: true, schema: { type: string } }
    CaseId: { name: caseId, in: path, required: true, schema: { type: string } }
    PolicyId: { name: policyId, in: path, required: true, schema: { type: string } }
  schemas:
    FinancialPolicyBase:
      type: object
      additionalProperties: false
      required: [currency, rounding_mode, effective_from, change_reason, rules]
      properties:
        currency: { type: string, enum: [IRR] }
        rounding_mode: { type: string, enum: [floor, half_up] }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        change_reason: { type: string, minLength: 10, maxLength: 2000 }
    TaxPolicyInput:
      allOf:
        - { $ref: "#/components/schemas/FinancialPolicyBase" }
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              minItems: 1
              items:
                type: object
                required: [code, component, jurisdiction, rate_basis_points, priority]
                properties:
                  code: { type: string }
                  component: { type: string, enum: [product, packaging, grinding, shipping] }
                  jurisdiction: { type: string }
                  rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
                  priority: { type: integer, minimum: 1, maximum: 1000 }
                  applicability: { type: [object, "null"] }
    CommissionPolicyInput:
      allOf:
        - { $ref: "#/components/schemas/FinancialPolicyBase" }
        - type: object
          required: [rules]
          properties:
            rules:
              type: array
              minItems: 1
              items:
                type: object
                required: [code, component, rate_basis_points, priority]
                properties:
                  code: { type: string }
                  component: { type: string, enum: [product, packaging, grinding, shipping] }
                  owner_type: { type: [string, "null"], enum: [roastery, rosta, null] }
                  rate_basis_points: { type: integer, minimum: 0, maximum: 10000 }
                  priority: { type: integer, minimum: 1, maximum: 1000 }
                  applicability: { type: [object, "null"] }
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      properties:
        amount: { type: integer, minimum: 1, description: "IRR amount; omitted means the full remaining refundable amount." }
        reason: { type: string, maxLength: 2000 }
        idempotency_key: { type: string, minLength: 16, maxLength: 160 }
    ResolveRefundRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [succeeded, failed, cancelled] }
        provider_reference: { type: [string, "null"], maxLength: 190 }
        failure_code: { type: [string, "null"], maxLength: 160 }
        message: { type: [string, "null"], maxLength: 2000 }
    ResolveCaseRequest:
      type: object
      additionalProperties: false
      required: [status, resolution]
      properties:
        status: { type: string, enum: [resolved, dismissed] }
        resolution: { type: string, maxLength: 5000 }
    SettlementPayoutEvidence:
      type: object
      additionalProperties: false
      required: [source, executed_at, amount, currency]
      properties:
        source: { type: string, maxLength: 80 }
        executed_at: { type: string, format: date-time }
        amount: { type: integer, minimum: 1, description: "Must equal the server-calculated batch net_total." }
        currency: { type: string, enum: [IRR] }
        note: { type: [string, "null"], maxLength: 1000 }
    ResolveSettlementBatchRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [process, paid, failed, review] }
        payout_reference: { type: [string, "null"], maxLength: 190 }
        payout_method: { type: [string, "null"], enum: [manual_bank_transfer, provider_dashboard, null] }
        payout_evidence:
          anyOf:
            - { $ref: "#/components/schemas/SettlementPayoutEvidence" }
            - { type: "null" }
        failure_code: { type: [string, "null"], maxLength: 160 }
        failure_message: { type: [string, "null"], maxLength: 1000 }
