openapi: 3.1.0
info:
  title: Rosta Seller Operations API
  version: 2026-08-29-ps5d
  description: Scoped roastery operations and server-defined workspace KPI composition for the whole-bean marketplace.
servers:
  - url: https://api-staging.rosta.shop/api/v1
security:
  - sanctumSession: []
paths:
  /seller/workspace:
    get:
      operationId: getSellerWorkspace
      description: Returns one server-composed non-financial KPI snapshot per roastery accessible to the authenticated seller.
      responses:
        "200":
          description: Scoped seller workspace snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [items, generated_at]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [roastery, access_roles, kpis]
                          properties:
                            roastery:
                              type: object
                              required: [id, name, status]
                              properties:
                                id: { type: string }
                                name: { type: string }
                                status: { type: string, enum: [pending, verified, suspended, rejected] }
                            access_roles:
                              type: array
                              items: { type: string }
                            kpis:
                              type: object
                              required: [pending_acceptance, active_fulfillment, active_shipping, open_incidents]
                              properties:
                                pending_acceptance: { type: integer, minimum: 0 }
                                active_fulfillment: { type: integer, minimum: 0 }
                                active_shipping: { type: integer, minimum: 0 }
                                open_incidents: { type: integer, minimum: 0 }
                      generated_at: { type: string, format: date-time }
        "403": { description: Seller or administrator role required }
  /seller/roasteries:
    get:
      operationId: listAccessibleSellerRoasteries
      responses:
        "200":
          { description: Roasteries scoped to the authenticated seller or all for an administrator }
        "403": { description: Seller or administrator role required }
    post:
      operationId: createSellerRoastery
      responses:
        "201": { description: Pending roastery created and owner scope assigned }
  /seller/origins:
    get:
      operationId: listSellerOrigins
      responses:
        "200": { description: Origins available for product authoring }
  /seller/roasteries/{roasteryId}/products:
    get:
      operationId: listSellerProducts
      parameters: [{ $ref: "#/components/parameters/RoasteryId" }]
      responses:
        "200": { description: Scoped product collection }
        "404": { description: Roastery is outside the user scope }
    post:
      operationId: createSellerProduct
      parameters: [{ $ref: "#/components/parameters/RoasteryId" }]
      responses:
        "201": { description: Draft/review product created }
        "403": { description: Owner or manager role required }
  /seller/roasteries/{roasteryId}/products/{productId}:
    get:
      operationId: getSellerProduct
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "200": { description: Scoped product detail }
    patch:
      operationId: updateSellerProduct
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "200": { description: Product updated and verification reset when required }
  /seller/roasteries/{roasteryId}/products/{productId}/variants:
    post:
      operationId: createSellerWholeBeanVariant
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "201": { description: Whole-bean weight variant created }
  /seller/roasteries/{roasteryId}/products/{productId}/roast-batches:
    get:
      operationId: listSellerRoastBatches
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "200": { description: Roast batch collection }
    post:
      operationId: createSellerRoastBatch
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/ProductId" }
      responses:
        "201": { description: Immutable roast batch created }
  /seller/roasteries/{roasteryId}/variants/{variantId}/stock-ledger:
    get:
      operationId: listSellerStockLedger
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/VariantId" }
      responses:
        "200": { description: Append-only stock ledger }
  /seller/roasteries/{roasteryId}/variants/{variantId}/stock-adjustments:
    post:
      operationId: createSellerStockAdjustment
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/VariantId" }
      responses:
        "201": { description: Idempotent stock adjustment recorded }
        "409": { description: Adjustment would make stock negative or idempotency conflicts }
  /seller/roasteries/{roasteryId}/orders:
    get:
      operationId: listSellerOrders
      parameters: [{ $ref: "#/components/parameters/RoasteryId" }]
      responses:
        "200": { description: Scoped operational order queue }
  /seller/roasteries/{roasteryId}/orders/{orderId}/fulfillment:
    patch:
      operationId: transitionSellerFulfillment
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200": { description: Valid fulfillment transition applied }
        "409": { description: Invalid state transition }
  /seller/roasteries/{roasteryId}/orders/{orderId}/incidents:
    post:
      operationId: reportSellerFulfillmentIncident
      description: Report an exceptional inability to fulfil without rejecting, restocking or refunding the order.
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200": { description: Incident recorded and seller transitions paused }
        "409": { description: Incident already open or sub-order state is not eligible }
  /seller/roasteries/{roasteryId}/media/uploads:
    post:
      operationId: createSellerMediaUploadIntent
      parameters: [{ $ref: "#/components/parameters/RoasteryId" }]
      responses:
        "201": { description: Signed object upload intent }
        "503": { description: Media uploads disabled or storage unavailable }
  /seller/roasteries/{roasteryId}/media/uploads/{uploadId}/complete:
    post:
      operationId: completeSellerMediaUpload
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "202": { description: Object queued for server-side validation and variant processing }
  /seller/roasteries/{roasteryId}/media/uploads/{uploadId}:
    get:
      operationId: showSellerMediaUpload
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "200": { description: Uploading, Processing, Ready, Rejected, Failed or Expired state }
        "404": { description: Upload is outside seller scope }
  /seller/roasteries/{roasteryId}/media/uploads/{uploadId}/retry:
    post:
      operationId: retrySellerMediaUpload
      parameters:
        - { $ref: "#/components/parameters/RoasteryId" }
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "202": { description: Bounded explicit retry accepted }
        "409": { description: Upload is not safely retryable }
  /seller/roasteries/{roasteryId}/settlements:
    get:
      operationId: listSellerSettlementOverview
      parameters: [{ $ref: "#/components/parameters/RoasteryId" }]
      responses:
        "200": { description: Held, eligible, scheduled and paid balances plus payout batches }
        "404": { description: Roastery is outside the user scope }
components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: rosta_session
  parameters:
    RoasteryId:
      name: roasteryId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string }
