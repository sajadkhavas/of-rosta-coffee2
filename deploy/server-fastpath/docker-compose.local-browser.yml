name: rosta-local-browser

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rosta_local_acceptance
      MYSQL_USER: rosta
      MYSQL_PASSWORD: rosta_local_acceptance
      MYSQL_ROOT_PASSWORD: rosta_local_root
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -prosta_local_root --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
