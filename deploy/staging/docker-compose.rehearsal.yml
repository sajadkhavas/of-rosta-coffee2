name: rosta-r4a-rehearsal

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

x-backend-app: &backend-app
  image: rosta-r4a-api:${ROSTA_IMAGE_TAG:?ROSTA_IMAGE_TAG is required}
  build:
    context: ../../backend
    dockerfile: Dockerfile.production
    target: app
  environment:
    APP_ENV: staging
    APP_DEBUG: "false"
    APP_KEY: ${R4A_APP_KEY:?R4A_APP_KEY is required}
    APP_URL: http://edge:8080
    LOG_CHANNEL: stderr
    FRONTEND_ALLOWED_ORIGINS: http://127.0.0.1:18080
    SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:18080
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    SESSION_ENCRYPT: "true"
    SESSION_SAME_SITE: lax
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: rosta_rehearsal
    DB_USERNAME: rosta
    DB_PASSWORD: ${R4A_DB_PASSWORD:?R4A_DB_PASSWORD is required}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${R4A_REDIS_PASSWORD:?R4A_REDIS_PASSWORD is required}
    ROSTA_PAYMENT_ENABLED: "false"
    PAYMENT_DRIVER: disabled
    ROSTA_REFUND_ENABLED: "false"
    REFUND_DRIVER: disabled
    ROSTA_SMS_ENABLED: "false"
    SMS_DRIVER: disabled
    ROSTA_MEDIA_UPLOADS_ENABLED: "true"
    ROSTA_MEDIA_UPLOAD_DISK: s3
    FILESYSTEM_DISK: s3
    S3_ACCESS_KEY_ID: ${R4A_S3_ACCESS_KEY:?R4A_S3_ACCESS_KEY is required}
    S3_SECRET_ACCESS_KEY: ${R4A_S3_SECRET_KEY:?R4A_S3_SECRET_KEY is required}
    S3_DEFAULT_REGION: us-east-1
    S3_BUCKET: rosta-media
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_URL: http://edge:8081/rosta-media
    S3_USE_PATH_STYLE_ENDPOINT: "true"
    ROSTA_MEDIA_PUBLIC_BASE_URL: http://edge:8081/rosta-media
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - app-storage:/var/www/html/storage
  networks:
    - backend
    - object-storage
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rosta_rehearsal
      MYSQL_USER: rosta
      MYSQL_PASSWORD: ${R4A_DB_PASSWORD:?R4A_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${R4A_MYSQL_ROOT_PASSWORD:?R4A_MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${R4A_REDIS_PASSWORD:?R4A_REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${R4A_REDIS_PASSWORD:?R4A_REDIS_PASSWORD is required}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${R4A_S3_ACCESS_KEY:?R4A_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${R4A_S3_SECRET_KEY:?R4A_S3_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    networks:
      - object-storage
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing local/rosta-media
        mc anonymous set download local/rosta-media
    environment:
      MINIO_ROOT_USER: ${R4A_S3_ACCESS_KEY:?R4A_S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${R4A_S3_SECRET_KEY:?R4A_S3_SECRET_KEY is required}
    networks:
      - object-storage
    security_opt:
      - no-new-privileges:true

  api:
    <<: *backend-app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    <<: *backend-app
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=critical,default,notifications
      - --sleep=1
      - --tries=1
      - --timeout=30
      - --max-time=1200
      - --memory=256

  scheduler:
    <<: *backend-app
    command: ["php", "artisan", "schedule:work"]

  api-web:
    image: rosta-r4a-api-web:${ROSTA_IMAGE_TAG:?ROSTA_IMAGE_TAG is required}
    build:
      context: ../../backend
      dockerfile: Dockerfile.production
      target: web
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage:ro
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    image: rosta-r4a-frontend:${ROSTA_IMAGE_TAG:?ROSTA_IMAGE_TAG is required}
    build:
      context: ../..
      dockerfile: Dockerfile.staging
      args:
        VITE_SITE_URL: http://127.0.0.1:18080
        VITE_API_URL: http://127.0.0.1:18080/api/v1
        VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:18080
        VITE_ALLOW_INDEXING: "false"
        VITE_PERFORMANCE_ENDPOINT: ""
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ROSTA_INTERNAL_API_URL: http://api-web:8080/api/v1
    depends_on:
      api-web:
        condition: service_healthy
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  edge:
    image: caddy:2.10.2-alpine
    depends_on:
      frontend:
        condition: service_healthy
      api-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - ./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro
    networks:
      - edge
      - backend
      - object-storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/robots.txt || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true
  object-storage:
    internal: true

volumes:
  mysql-data:
  redis-data:
  minio-data:
  app-storage:
