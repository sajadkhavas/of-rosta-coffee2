name: ${COMPOSE_PROJECT_NAME:-rosta-ps7-rehearsal}

services:
  frontend:
    image: node:22-alpine
    command:
      - node
      - -e
      - |
        const http = require('http');
        const server = http.createServer((req, res) => {
          res.statusCode = 200;
          res.setHeader('Content-Type', req.url === '/robots.txt' ? 'text/plain' : 'text/html; charset=utf-8');
          res.end(req.url === '/robots.txt' ? 'User-agent: *\nAllow: /\n' : '<!doctype html><html><body>rosta-production-rehearsal</body></html>');
        });
        server.listen(3000, '0.0.0.0');
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - rehearsal

  api-web:
    image: nginx:1.27-alpine
    command:
      - /bin/sh
      - -c
      - |
        sed -i 's/listen       80;/listen 8080;/' /etc/nginx/conf.d/default.conf
        mkdir -p /usr/share/nginx/html/api/v1/health
        printf '%s\n' '{"data":{"status":"ok"}}' > /usr/share/nginx/html/api/v1/health/live
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/live || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - rehearsal

  edge:
    image: caddy:2.10.2-alpine
    depends_on:
      frontend:
        condition: service_healthy
      api-web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROSTA_REHEARSAL_PORT:-18080}:8080"
    volumes:
      - ./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - rehearsal

networks:
  rehearsal:
