name: PS12 UI Bootstrap

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12-ui)')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup PHP 8.3 for backend contract audit
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22
      - name: Normalize generator against current source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('src/lib/api/schemas.ts')
          old = '    quantity: z.number().int().min(1).max(20),\n'
          new = '    quantity: z.number().int().min(1).max(1000),\n'
          content = schema.read_text(encoding='utf-8')
          if content.count(old) != 2:
              raise SystemExit(f'expected two quantity contracts, found {content.count(old)}')
          schema.write_text(content.replace(old, new), encoding='utf-8')

          script = Path('scripts/ps12-ui-bootstrap.py')
          source = script.read_text(encoding='utf-8')

          quantity_statement = "replace_once('src/lib/api/schemas.ts', \"    quantity: z.number().int().min(1).max(20),\\n\", \"    quantity: z.number().int().min(1).max(1000),\\n\")\n"
          if source.count(quantity_statement) != 1:
              raise SystemExit('quantity replacement statement not found exactly once')
          source = source.replace(quantity_statement, '')

          old_panel_anchor = "    '          <Link to=\"/panel/organization\"',\n"
          new_panel_anchor = "    '            <Link\\n              to=\"/panel/organization\"',\n"
          if source.count(old_panel_anchor) != 1:
              raise SystemExit('panel organization anchor not found exactly once')
          source = source.replace(old_panel_anchor, new_panel_anchor, 1)

          script.write_text(source, encoding='utf-8')
          PY
      - name: Generate PS12 UI and contract updates
        run: python3 scripts/ps12-ui-bootstrap.py
      - name: Normalize generated strict frontend contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cafes = Path('src/lib/api/cafes.ts')
          source = cafes.read_text(encoding='utf-8')
          replacements = {
              '  opening_hours: z.record(z.string(), z.unknown()).or(z.array(z.unknown())).default([]),\n': '  opening_hours: z.record(z.string(), z.unknown()).or(z.array(z.unknown())),\n',
              '  amenities: z.array(z.string()).max(50).default([]),\n': '  amenities: z.array(z.string()).max(50),\n',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'cafes contract anchor mismatch: {old!r}')
              source = source.replace(old, new, 1)
          cafes.write_text(source, encoding='utf-8')

          persian = Path('src/lib/persian.ts')
          source = persian.read_text(encoding='utf-8')
          if 'export function formatIrr(' in source:
              raise SystemExit('formatIrr unexpectedly already exists')
          anchor = 'export function formatToman(n: number): string {\n  return `${n.toLocaleString("fa-IR")} تومان`;\n}\n'
          if source.count(anchor) != 1:
              raise SystemExit('formatToman anchor mismatch')
          addition = anchor + '\nexport function formatIrr(n: number): string {\n  return `${n.toLocaleString("fa-IR")} ریال`;\n}\n'
          persian.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Install locked backend dependencies for contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          composer install --no-interaction --prefer-dist --no-progress
      - name: Validate generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          while IFS= read -r file; do php -l "$file"; done < <(git diff --name-only --diff-filter=ACM | grep '^backend/.*\.php$' || true)
          php backend/scripts/audit-business-contract.php
          bun install --frozen-lockfile
          bun run check
      - name: Commit generated implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ps12): add cafe and wholesale workspaces'
          git push origin "HEAD:${GITHUB_REF_NAME}"
