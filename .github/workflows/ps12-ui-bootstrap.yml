name: PS12 UI Bootstrap

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12-ui)')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22
      - name: Generate PS12 UI and contract updates
        run: python3 scripts/ps12-ui-bootstrap.py
      - name: Validate generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          while IFS= read -r file; do php -l "$file"; done < <(git diff --name-only --diff-filter=ACM | grep '^backend/.*\.php$' || true)
          php backend/scripts/audit-business-contract.php
          bun install --frozen-lockfile
          bun run check
      - name: Commit generated implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ps12): add cafe and wholesale workspaces'
          git push origin "HEAD:${GITHUB_REF_NAME}"
