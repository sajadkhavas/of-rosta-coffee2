name: Browser Acceptance CI

on:
  pull_request:
    paths:
      - "src/**"
      - "backend/**"
      - "tests/browser/**"
      - "scripts/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/browser-acceptance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-and-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rosta_test
          MYSQL_USER: rosta
          MYSQL_PASSWORD: rosta_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      EVIDENCE_DIR: /tmp/rosta-r3-evidence/${{ github.run_id }}/r3c
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      LOG_CHANNEL: stack
      LOG_STACK: single
      FRONTEND_ALLOWED_ORIGINS: http://127.0.0.1:3000
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:3000
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rosta_test
      DB_USERNAME: rosta
      DB_PASSWORD: rosta_test
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SMS_DRIVER: acceptance
      ROSTA_SMS_ENABLED: "false"
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      VITE_SITE_URL: http://127.0.0.1:3000
      VITE_API_URL: http://127.0.0.1:8000/api/v1
      VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:8000,127.0.0.1:3000
      VITE_ALLOW_INDEXING: "false"
      ROSTA_INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
      R3C_FRONTEND_BASE: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Freeze browser acceptance snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" test-results
          test -z "$(git status --porcelain)"
          test -s bun.lock
          test -s backend/composer.lock
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "php=$(php --version | head -n 1)"
          } | tee "$EVIDENCE_DIR/versions.txt"
          sha256sum package.json bun.lock backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/dependencies-before.sha256"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/bun-install.log"
          cd backend
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install.log"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Run backend permanent gate
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer check 2>&1 | tee "$EVIDENCE_DIR/backend-check.log"

      - name: Prepare acceptance database
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          php artisan migrate:fresh --force 2>&1 | tee "$EVIDENCE_DIR/mysql-migrations.log"
          php artisan rosta:readiness --strict --json 2>&1 | tee "$EVIDENCE_DIR/backend-readiness.json"
          php artisan rosta:acceptance-fixtures --json > "$EVIDENCE_DIR/acceptance-fixtures.json"
          grep -q 'ROSTA_R3A_ACCEPTANCE_FIXTURES_COMPLETE' "$EVIDENCE_DIR/acceptance-fixtures.json"

      - name: Build production SSR
        shell: bash
        env:
          NODE_ENV: production
          NITRO_PRESET: node-server
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$EVIDENCE_DIR/frontend-build.log"
          git diff -- src/routeTree.gen.ts | tee "$EVIDENCE_DIR/route-tree.diff"
          cp src/routeTree.gen.ts "$EVIDENCE_DIR/routeTree.gen.ts"

      - name: Boot Laravel, notification worker and SSR
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd backend
            php artisan serve --host=127.0.0.1 --port=8000
          ) > "$EVIDENCE_DIR/laravel-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/laravel.pid"
          (
            cd backend
            php artisan queue:work redis --queue=notifications --sleep=1 --tries=1 --timeout=30
          ) > "$EVIDENCE_DIR/queue-worker.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/worker.pid"
          NODE_ENV=production HOST=127.0.0.1 PORT=3000 \
            node .output/server/index.mjs > "$EVIDENCE_DIR/frontend-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/frontend.pid"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live > /dev/null \
              && curl --fail --silent http://127.0.0.1:3000/robots.txt > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$EVIDENCE_DIR/laravel-runtime.log"
          cat "$EVIDENCE_DIR/frontend-runtime.log"
          exit 1

      - name: Run R3C contract audit
        shell: bash
        run: |
          set -o pipefail
          bun run audit:r3c 2>&1 | tee "$EVIDENCE_DIR/audit-r3c.log"
          cp r3c-browser-audit.json "$EVIDENCE_DIR/"

      - name: Run real browser journeys
        shell: bash
        run: |
          set -o pipefail
          export R3C_JUNIT_PATH="$EVIDENCE_DIR/r3c-junit.xml"
          bun run test:browser -- --config=playwright.config.ts 2>&1 | tee "$EVIDENCE_DIR/browser.log"
          grep -q 'failures="0"' "$EVIDENCE_DIR/r3c-junit.xml"
          kill -0 "$(cat "$EVIDENCE_DIR/laravel.pid")"
          kill -0 "$(cat "$EVIDENCE_DIR/worker.pid")"
          kill -0 "$(cat "$EVIDENCE_DIR/frontend.pid")"

      - name: Enforce private evidence and clean workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f r3c-browser-audit.json backend/.env backend/*-audit.json
          rm -rf backend/storage/framework/cache/phpstan backend/storage/framework/testing test-results
          sha256sum package.json bun.lock backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/dependencies-after.sha256"
          cmp "$EVIDENCE_DIR/dependencies-before.sha256" "$EVIDENCE_DIR/dependencies-after.sha256"
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD|09123456789|0912000000[12]|Local OTP delivery|"code"[[:space:]]*:[[:space:]]*"[0-9]{6}"' "$EVIDENCE_DIR"; then
            echo "Sensitive authentication material entered R3C evidence." >&2
            exit 1
          fi
          if find "$EVIDENCE_DIR" -type f \( -name '*.png' -o -name '*.webm' -o -name '*.zip' \) | grep -q .; then
            echo "Visual or trace artifacts are forbidden for OTP browser acceptance." >&2
            exit 1
          fi
          git diff --check
          git status --porcelain --untracked-files=all | tee "$EVIDENCE_DIR/git-status-before-generated-reset.txt"
          unexpected_status="$(
            git status --porcelain --untracked-files=all |
              grep -vE '^ M src/routeTree\.gen\.ts$' || true
          )"
          test -z "$unexpected_status"
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            test -s "$EVIDENCE_DIR/route-tree.diff"
            git checkout -- src/routeTree.gen.ts
          fi
          git status --short --untracked-files=all | tee "$EVIDENCE_DIR/git-status-final.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ROSTA_R3C_BROWSER_ACCEPTANCE_COMPLETE" | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload R3C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r3c-browser-${{ github.run_id }}
          path: /tmp/rosta-r3-evidence/${{ github.run_id }}/r3c
          if-no-files-found: warn
          retention-days: 14

      - name: Stop browser acceptance runtime
        if: always()
        shell: bash
        run: |
          for pid_file in "$EVIDENCE_DIR/frontend.pid" "$EVIDENCE_DIR/worker.pid" "$EVIDENCE_DIR/laravel.pid"; do
            if test -s "$pid_file"; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
