name: Temporary R5I R4 Debug Export

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export-r4-source:
    if: github.head_ref == 'program/r5i-delivery-settlement-payouts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Collect R4 source and workflow map
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/r5i-r4-debug
          mkdir -p "$out"
          find .github/workflows -maxdepth 1 -type f -print | sort > "$out/workflow-files.txt"
          grep -RIl "R4 Staging Package CI\|hosted staging package rehearsal\|hosted-rehearsal" .github deploy scripts backend 2>/dev/null | sort > "$out/r4-matches.txt" || true
          while IFS= read -r file; do
            test -f "$file" || continue
            target="$out/source/$file"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < "$out/r4-matches.txt"
          find deploy/staging -maxdepth 3 -type f -print 2>/dev/null | sort > "$out/staging-files.txt" || true
          while IFS= read -r file; do
            test -f "$file" || continue
            target="$out/source/$file"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < "$out/staging-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: r5i-r4-debug-${{ github.sha }}
          path: /tmp/r5i-r4-debug
          if-no-files-found: error
          retention-days: 1
