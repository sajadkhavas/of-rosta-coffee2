name: Finalize Rosta generated files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-rosta-generated-files.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-phases-1-4
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Generate lockfile and route tree
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_ALLOW_INDEXING: "false"
        run: |
          bun install
          bun run build
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "chore: finalize generated lockfile and route tree"
          git push origin HEAD:agent/migrate-phases-1-4
