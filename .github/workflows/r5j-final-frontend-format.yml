name: Temporary R5J Frontend Formatter

on:
  pull_request:
    branches: [integration/rosta-r5-marketplace]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5j-final-frontend-formatter
  cancel-in-progress: true

jobs:
  format-and-publish:
    if: github.head_ref == 'program/r5j-rosta-hub-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Format exact R5J frontend scope
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx prettier --write \
            package.json \
            docs/r5/R5J_ROSTA_HUB_OPERATIONS.md \
            scripts/audit-r5j-rosta-hub-operations.mjs \
            src/components/Navbar.tsx \
            src/lib/api/contracts.ts \
            src/lib/api/hub-operations.ts \
            src/lib/api/orders.ts \
            src/lib/api/schemas.ts \
            src/routes/hub.operations.tsx \
            'src/routes/orders.$id.tsx' \
            tests/unit/r5j-hub-operations.test.ts
          bunx prettier --check \
            package.json \
            docs/r5/R5J_ROSTA_HUB_OPERATIONS.md \
            scripts/audit-r5j-rosta-hub-operations.mjs \
            src/components/Navbar.tsx \
            src/lib/api/contracts.ts \
            src/lib/api/hub-operations.ts \
            src/lib/api/orders.ts \
            src/lib/api/schemas.ts \
            src/routes/hub.operations.tsx \
            'src/routes/orders.$id.tsx' \
            tests/unit/r5j-hub-operations.test.ts
          rm -f .github/workflows/r5j-final-frontend-format.yml
          git config user.name 'Rosta R5J Formatter'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'R5J format final frontend scope'
          git push origin HEAD:program/r5j-rosta-hub-operations
