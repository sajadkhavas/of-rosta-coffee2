name: PS12 Product Bootstrap

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12-product)')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22
      - name: Add visible wholesale tiers to product page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/products.$slug.tsx')
          source = path.read_text(encoding='utf-8')
          anchor = '''            </section>\n            <div className="mt-6 grid gap-3 rounded-xl border border-[color:var(--roast)]/40 bg-[color:var(--night)] p-4 text-xs leading-7 text-[color:var(--light)]">\n'''
          replacement = '''            </section>\n            {selectedVariant?.wholesaleTiers?.length ? (\n              <section\n                className="mt-6 rounded-2xl border border-[color:var(--roast)]/40 bg-[color:var(--dark)] p-4"\n                aria-labelledby="wholesale-pricing-title"\n              >\n                <div className="flex flex-wrap items-start justify-between gap-3">\n                  <div>\n                    <h2 id="wholesale-pricing-title" className="text-sm font-bold">\n                      قیمت همکاری کافه‌ها\n                    </h2>\n                    <p className="mt-1 text-xs leading-6 text-[color:var(--light)]">\n                      این جدول قیمت‌های تعریف‌شده روستری را نشان می‌دهد. اعمال قیمت همکاری فقط برای کافه تأییدشده و بر اساس وزن واقعی همین Variant در Quote سمت سرور انجام می‌شود.\n                    </p>\n                  </div>\n                  <Link\n                    to="/cafes/apply"\n                    className="rounded-lg border border-[color:var(--roast)] px-3 py-2 text-xs font-bold text-[color:var(--roast)]"\n                  >\n                    درخواست حساب کافه\n                  </Link>\n                </div>\n                <div className="mt-4 overflow-x-auto">\n                  <table className="w-full min-w-[28rem] text-sm">\n                    <thead className="text-xs text-[color:var(--light)]">\n                      <tr className="border-b border-[color:var(--mid)]">\n                        <th className="px-3 py-2 text-start">حداقل وزن سفارش</th>\n                        <th className="px-3 py-2 text-start">قیمت واحد این بسته</th>\n                      </tr>\n                    </thead>\n                    <tbody>\n                      {selectedVariant.wholesaleTiers.map((tier) => (\n                        <tr key={tier.minWeightGrams} className="border-b border-[color:var(--mid)]/60 last:border-0">\n                          <td className="px-3 py-3 font-bold">\n                            {(tier.minWeightGrams / 1000).toLocaleString("fa-IR")} کیلو\n                          </td>\n                          <td className="px-3 py-3 font-mono text-[color:var(--roast)]">\n                            {formatIrr(tier.unitPrice)}\n                          </td>\n                        </tr>\n                      ))}\n                    </tbody>\n                  </table>\n                </div>\n                <p className="mt-3 text-[11px] leading-6 text-[color:var(--light)]">\n                  مبلغ نهایی، موجودی و صلاحیت B2B هنگام ساخت Quote دوباره توسط سرور رستا بررسی می‌شود؛ نمایش این جدول به‌تنهایی حق دریافت قیمت همکاری ایجاد نمی‌کند.\n                </p>\n              </section>\n            ) : null}\n            <div className="mt-6 grid gap-3 rounded-xl border border-[color:var(--roast)]/40 bg-[color:var(--night)] p-4 text-xs leading-7 text-[color:var(--light)]">\n'''
          if source.count(anchor) != 1:
              raise SystemExit(f'product pricing anchor mismatch: {source.count(anchor)}')
          path.write_text(source.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Remove temporary generation machinery
        shell: bash
        run: |
          rm -f .github/workflows/ps12-ui-bootstrap.yml
          rm -f scripts/ps12-ui-bootstrap.py
          rm -f .github/workflows/ps12-product-bootstrap.yml
      - name: Validate final product source
        shell: bash
        run: |
          set -Eeuo pipefail
          bun install --frozen-lockfile
          bunx prettier --write 'src/routes/products.$slug.tsx'
          git diff --check
          bun run check
      - name: Commit product visibility closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ps12): expose wholesale tiers on product page'
          git push origin "HEAD:${GITHUB_REF_NAME}"
