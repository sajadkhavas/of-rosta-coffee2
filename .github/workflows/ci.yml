name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: program/r5d-product-packaging

      - name: Apply R5D seller packaging allowlist
        if: github.actor != 'github-actions[bot]' && github.head_ref == 'program/r5d-product-packaging'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lib/api/seller-operations.ts')
          text = path.read_text()
          old = '''        brewing_suggestions: "brewingSuggestions",
        seo_title: "seoTitle",'''
          new = '''        brewing_suggestions: "brewingSuggestions",
        packaging_fee_mode: "packagingFeeMode",
        packaging_fee_amount: "packagingFeeAmount",
        seo_title: "seoTitle",'''
          if old not in text:
              raise SystemExit('seller PATCH allowlist anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run complete frontend quality gate
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:8000
          VITE_ALLOW_INDEXING: "false"
        run: bun run check 2>&1 | tee frontend-check.log

      - name: Commit R5D seller packaging fix
        if: github.actor != 'github-actions[bot]' && github.head_ref == 'program/r5d-product-packaging'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/api/seller-operations.ts
          git commit -m "R5D preserve packaging fields in seller PATCH"
          git push origin HEAD:program/r5d-product-packaging

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            frontend-check.log
            bundle-report.json
            release-integrity-audit.json
          if-no-files-found: ignore
          retention-days: 14
