name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit High/Critical dependencies
        run: bun run audit:dependencies

      - name: Run complete frontend quality gate
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:8000
          VITE_ALLOW_INDEXING: "false"
        run: bun run check 2>&1 | tee frontend-check.log

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            dependency-audit.log
            frontend-check.log
            bundle-report.json
            release-integrity-audit.json
          if-no-files-found: ignore
          retention-days: 14
