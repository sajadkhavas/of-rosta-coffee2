name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies and refresh lockfile
        run: bun install
      - name: Build and generate route tree
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_ALLOW_INDEXING: "false"
        run: bun run build 2>&1 | tee build.log
      - name: Commit generated files on migration branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/migrate-phases-1-4'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "chore(generated): refresh lockfile and route tree"
          git push origin HEAD:agent/migrate-phases-1-4
      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle budget
        run: bun run bundle:check 2>&1 | tee bundle.log
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            bundle.log
            bundle-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Typecheck
        run: bun run typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Lint
        run: bun run lint 2>&1 | tee lint.log
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7
