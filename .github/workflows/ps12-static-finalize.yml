name: PS12 Static Finalize

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12-style-final)')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install AVIF encoder delegate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-plugin-aomenc

      - name: Apply deterministic PS12 style closure
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/Services/Checkout/OrderService.php')
          source = path.read_text(encoding='utf-8')
          old = """                    $quotedPricing = is_array($quoteItem->variant_snapshot)\n                        ? ($quoteItem->variant_snapshot['pricing'] ?? null)\n                        : null;\n"""
          new = """                    $quotedPricing = $quoteItem->variant_snapshot['pricing'] ?? null;\n"""
          if source.count(old) != 1:
              raise SystemExit(f'OrderService snapshot anchor mismatch: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          rm -f .github/workflows/ps12-static-finalize.yml

          cd backend
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint \
            app/Http/Controllers/Admin/AdminCafeController.php \
            app/Http/Controllers/Cafe/CafeAccountController.php \
            app/Http/Controllers/Cafe/CafeApplicationController.php \
            app/Http/Controllers/Cafe/CafeDirectoryController.php \
            app/Http/Controllers/Seller/SellerWholesaleTierController.php \
            app/Http/Requests/Cafe/ApplyCafeRequest.php \
            app/Http/Requests/Cafe/SetCafeStatusRequest.php \
            app/Http/Requests/Cafe/UpdateCafeRequest.php \
            app/Http/Requests/Catalog/ReplaceWholesaleTiersRequest.php \
            app/Models/CafeMembership.php \
            app/Services/B2B/WholesaleTierService.php \
            app/Services/Cafe/CafeDirectoryService.php \
            app/Services/Cafe/CafeService.php \
            app/Services/Checkout/OrderService.php \
            routes/api.php \
            tests/Feature/PS12CafeWholesaleTest.php
          cd ..

          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          allowed=(
            .github/workflows/ps12-static-finalize.yml
            backend/app/Http/Controllers/Admin/AdminCafeController.php
            backend/app/Http/Controllers/Cafe/CafeAccountController.php
            backend/app/Http/Controllers/Cafe/CafeApplicationController.php
            backend/app/Http/Controllers/Cafe/CafeDirectoryController.php
            backend/app/Http/Controllers/Seller/SellerWholesaleTierController.php
            backend/app/Http/Requests/Cafe/ApplyCafeRequest.php
            backend/app/Http/Requests/Cafe/SetCafeStatusRequest.php
            backend/app/Http/Requests/Cafe/UpdateCafeRequest.php
            backend/app/Http/Requests/Catalog/ReplaceWholesaleTiersRequest.php
            backend/app/Models/CafeMembership.php
            backend/app/Services/B2B/WholesaleTierService.php
            backend/app/Services/Cafe/CafeDirectoryService.php
            backend/app/Services/Cafe/CafeService.php
            backend/app/Services/Checkout/OrderService.php
            backend/routes/api.php
            backend/tests/Feature/PS12CafeWholesaleTest.php
          )

          for path in "${changed[@]}"; do
            found=false
            for permitted in "${allowed[@]}"; do
              if [[ "$path" == "$permitted" ]]; then
                found=true
                break
              fi
            done
            $found || {
              echo "Unexpected PS12 style mutation: $path" >&2
              exit 1
            }
          done

          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/ps12-static-finalize.yml' >/dev/null
          printf '%s\n' "${changed[@]}" | grep -Fx 'backend/app/Services/Checkout/OrderService.php' >/dev/null
          git diff --check

      - name: Validate complete backend contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          composer check

      - name: Commit final backend closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e .github/workflows/ps12-static-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ps12): close backend static and style gates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
