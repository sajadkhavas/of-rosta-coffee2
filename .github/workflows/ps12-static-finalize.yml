name: PS12 Static Finalize

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12-static)')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install AVIF encoder delegate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-plugin-aomenc
      - name: Patch redundant snapshot narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/Services/Checkout/OrderService.php')
          source = path.read_text(encoding='utf-8')
          old = """                    $quotedPricing = is_array($quoteItem->variant_snapshot)\n                        ? ($quoteItem->variant_snapshot['pricing'] ?? null)\n                        : null;\n"""
          new = """                    $quotedPricing = $quoteItem->variant_snapshot['pricing'] ?? null;\n"""
          if source.count(old) != 1:
              raise SystemExit(f'OrderService snapshot anchor mismatch: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/ps12-static-finalize.yml
      - name: Validate complete backend contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          composer install --no-interaction --prefer-dist --no-progress
          composer check
      - name: Commit static-analysis closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ps12): close backend static contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
