name: Rosta R2B1 Verified Product Push

on:
  pull_request:
    branches: [integration/rosta-r-program]
    paths: [.github/workflows/r2b1-push-only.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-verified-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: program/r2b-php-quality
      EXPECTED_HEAD: 42620fe43c3ba73a40c7dd508a3df3bba4f0f512
      EVIDENCE_DIR: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program/r2b-php-quality
          fetch-depth: 0
      - name: Reproduce previously accepted tree
        shell: bash
        run: |
          set -Eeuxo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          for script in r2b-known-repairs.py r2b-feature-repairs.py r2b-feature-repairs-2.py r2b-feature-repairs-3.py r2b-feature-repairs-4.py; do
            git show "origin/automation/r2b-executor:.github/scripts/$script" > "/tmp/$script"
          done
          git show origin/automation/r2b1-final-executor:.github/scripts/r2b1-final-session-repair.py > /tmp/r2b1-final-session-repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r2b-known-repairs.py')
          path.write_text(path.read_text().replace('pull_request:\\n', 'pull_request:\\\\n'))
          PY
          for script in r2b-known-repairs.py r2b-feature-repairs.py r2b-feature-repairs-2.py r2b-feature-repairs-3.py r2b-feature-repairs-4.py r2b1-final-session-repair.py; do
            python "/tmp/$script"
          done
          git diff --check
      - name: Verify scope commit and push
        shell: bash
        run: |
          set -Eeuxo pipefail
          exec > >(tee "$EVIDENCE_DIR/push.log") 2>&1
          tracked="$(git diff --name-only | sort)"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          printf 'TRACKED\n%s\nUNTRACKED\n%s\n' "$tracked" "$untracked"
          test "$(printf '%s\n' "$tracked" | wc -l)" -eq 22
          test "$(printf '%s\n' "$untracked" | wc -l)" -eq 3
          test -z "$(printf '%s\n' "$tracked" | grep -Ev '^(\.github/workflows/backend-ci\.yml|backend/(app|config/database\.php|scripts|tests)/)' || true)"
          test -z "$(printf '%s\n' "$untracked" | grep -Ev '^backend/(app|scripts)/' || true)"
          git config user.name "Rosta Program Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/backend-ci.yml backend/app backend/config/database.php backend/scripts backend/tests
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "fix(backend): complete feature and runtime contracts"
          commit="$(git rev-parse HEAD)"
          echo "$commit" | tee "$EVIDENCE_DIR/result-commit.txt"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "ROSTA_R2B1_FEATURE_GATE_COMPLETE" | tee "$EVIDENCE_DIR/result.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r2b1-push-evidence-${{ github.run_id }}
          path: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1-push
          if-no-files-found: warn
          retention-days: 14
