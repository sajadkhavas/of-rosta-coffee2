name: Temporary R5F Targeted Formatter

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace

permissions:
  contents: write

concurrency:
  group: r5f-format-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-r5f-diff:
    if: github.head_ref == 'program/r5f-roastery-grinding-selection'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          coverage: none

      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install locked backend dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format changed frontend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t frontend_files < <(
            git diff --name-only origin/integration/rosta-r5-marketplace...HEAD -- \
              '*.ts' '*.tsx' '*.mjs' '*.json' '*.md' \
              | grep -v '^src/routeTree.gen.ts$' || true
          )
          printf 'Frontend formatter targets:\n%s\n' "${frontend_files[*]:-none}"
          if ((${#frontend_files[@]})); then
            bunx prettier --write "${frontend_files[@]}"
          fi

      - name: Format changed backend files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t backend_files < <(
            git diff --name-only origin/integration/rosta-r5-marketplace...HEAD -- 'backend/*.php' 'backend/**/*.php' \
              | sed 's#^backend/##'
          )
          printf 'Backend formatter targets:\n%s\n' "${backend_files[*]:-none}"
          if ((${#backend_files[@]})); then
            cd backend
            vendor/bin/pint "${backend_files[@]}"
          fi

      - name: Remove temporary formatter
        run: rm -f .github/workflows/r5f-format-executor.yml

      - name: Commit formatted product files
        run: |
          git config user.name "Rosta R5F Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "R5F format accepted product diff"
          git push origin "HEAD:${{ github.head_ref }}"
