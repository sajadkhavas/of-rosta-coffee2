name: Rosta R2B3 Final PHP Gate

on:
  pull_request:
    branches: [integration/rosta-r-program]
    paths:
      - .github/workflows/r2b3-final-gate.yml
      - .github/scripts/r2b3-audit-style-repairs.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosta-r2b3-final-gate
  cancel-in-progress: false

jobs:
  format-gate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_BRANCH: program/r2b-php-quality
      EXPECTED_HEAD: bdc442dfb567ee801c50bcf7bfb318fbb6b819f9
      EVIDENCE_DIR: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b3-final
      APP_ENV: testing
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: single
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_PROCESS_TIMEOUT: "900"
    steps:
      - name: Checkout R2B product branch
        uses: actions/checkout@v4
        with:
          ref: program/r2b-php-quality
          fetch-depth: 0

      - name: Setup PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, redis, simplexml, sockets, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Verify exact snapshot and apply reviewed static tree
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test -s backend/composer.lock
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);'
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "php=$(php --version | head -n 1)"
            echo "composer=$(composer --version 2>&1 | head -n 1)"
          } | tee "$EVIDENCE_DIR/snapshot.txt"
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-before.sha256"
          git show origin/automation/r2b2-static-executor:.github/scripts/r2b2-model-resource-types.py > /tmp/r2b2-model-resource-types.py
          git show origin/automation/r2b2-static-executor:.github/scripts/r2b2-static-repairs.py > /tmp/r2b2-static-repairs.py
          git show origin/automation/r2b3-final-executor:.github/scripts/r2b3-audit-style-repairs.py > /tmp/r2b3-audit-style-repairs.py
          python /tmp/r2b2-model-resource-types.py 2>&1 | tee "$EVIDENCE_DIR/type-metadata.log"
          python /tmp/r2b2-static-repairs.py 2>&1 | tee "$EVIDENCE_DIR/static-repairs.log"
          python /tmp/r2b3-audit-style-repairs.py 2>&1 | tee "$EVIDENCE_DIR/audit-style-repairs.log"
          git diff --check

      - name: Install locked dependencies and boot Laravel
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install.log"
          php artisan about 2>&1 | tee "$EVIDENCE_DIR/artisan-about.log"

      - name: Apply Pint only to reported backend debt
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          set +e
          php vendor/bin/pint --parallel --test > "$EVIDENCE_DIR/pint-before.log" 2>&1
          before_status=$?
          set -e
          echo "pint_before=$before_status" | tee "$EVIDENCE_DIR/pint-before-status.txt"
          test "$before_status" -ne 0
          php vendor/bin/pint --parallel 2>&1 | tee "$EVIDENCE_DIR/pint-fix.log"
          php vendor/bin/pint --parallel --test 2>&1 | tee "$EVIDENCE_DIR/pint-after.log"
          git diff --check

      - name: Run every R2B gate independently
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          composer validate --strict 2>&1 | tee "$EVIDENCE_DIR/composer-validate.log"
          composer audit --locked 2>&1 | tee "$EVIDENCE_DIR/composer-audit.log"
          for gate in business checkout seo cooci-adoption fulfillment reviews-support media-storage openapi validation finance seller-operations admin-operations live-public staging; do
            composer "audit:$gate" 2>&1 | tee "$EVIDENCE_DIR/audit-$gate.log"
          done
          find . -maxdepth 1 -type f -name '*-audit.json' -print -exec cp {} "$EVIDENCE_DIR/" \;
          php artisan test --testsuite=Unit 2>&1 | tee "$EVIDENCE_DIR/tests-unit.log"
          php artisan test 2>&1 | tee "$EVIDENCE_DIR/tests-all.log"
          php vendor/bin/phpstan analyse --memory-limit=1G --error-format=table 2>&1 | tee "$EVIDENCE_DIR/phpstan.log"
          php vendor/bin/pint --parallel --test 2>&1 | tee "$EVIDENCE_DIR/pint-final-independent.log"

      - name: Run aggregate Composer gate once
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          composer check 2>&1 | tee "$EVIDENCE_DIR/composer-check.log"

      - name: Enforce R2B scope and push product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f backend/.env backend/*-audit.json
          rm -rf backend/storage/framework/testing
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-after.sha256"
          cmp "$EVIDENCE_DIR/composer-before.sha256" "$EVIDENCE_DIR/composer-after.sha256"
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed" | tee "$EVIDENCE_DIR/changed-files.txt"
          test -n "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -Ev '^backend/(app|bootstrap|config|public|routes|scripts|tests)/' || true)"
          test -z "$(printf '%s\n' "$changed" | grep -E '^backend/(composer\.json|composer\.lock|\.env|Dockerfile|docker-compose)' || true)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --stat | tee "$EVIDENCE_DIR/diff-stat.txt"
          git config user.name "Rosta Program Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app backend/bootstrap backend/config backend/public backend/routes backend/scripts backend/tests
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged" | tee "$EVIDENCE_DIR/staged-files.txt"
          test "$staged" = "$changed"
          git diff --cached --check
          git commit -m "refactor(backend): enforce static types and Laravel formatting"
          git push origin "HEAD:$TARGET_BRANCH"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/result-commit.txt"
          echo "ROSTA_R2B_PHP_QUALITY_COMPLETE" | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload final R2B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r2b3-final-${{ github.run_id }}
          path: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b3-final
          if-no-files-found: warn
          retention-days: 14
