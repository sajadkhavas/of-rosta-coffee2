name: Rosta R2B1 Feature Gate Executor

on:
  pull_request:
    branches:
      - integration/rosta-r-program
    paths:
      - .github/workflows/r2b-feature-gate.yml
      - .github/scripts/r2b-feature-repairs.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosta-r2b1-feature-gate
  cancel-in-progress: false

jobs:
  repair-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_BRANCH: program/r2b-php-quality
      EXPECTED_HEAD: 42620fe43c3ba73a40c7dd508a3df3bba4f0f512
      EVIDENCE_DIR: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1
      APP_ENV: testing
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: single
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_PROCESS_TIMEOUT: "900"
    steps:
      - name: Checkout R2B product branch
        uses: actions/checkout@v4
        with:
          ref: program/r2b-php-quality
          fetch-depth: 0

      - name: Setup PHP 8.3 and Composer 2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, redis, simplexml, sockets, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Verify exact baseline and create ephemeral key
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test -s backend/composer.lock
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);'
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "php=$(php --version | head -n 1)"
            echo "composer=$(composer --version 2>&1 | head -n 1)"
            echo "ephemeral_app_key=present"
          } | tee "$EVIDENCE_DIR/snapshot.txt"
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-before.sha256"

      - name: Apply reviewed R2B1 repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          git show origin/automation/r2b-executor:.github/scripts/r2b-known-repairs.py > /tmp/r2b-known-repairs.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r2b-known-repairs.py')
          source = path.read_text().replace('pull_request:\\n', 'pull_request:\\\\n')
          path.write_text(source)
          PY
          git show origin/automation/r2b-executor:.github/scripts/r2b-feature-repairs.py > /tmp/r2b-feature-repairs.py
          python /tmp/r2b-known-repairs.py 2>&1 | tee "$EVIDENCE_DIR/known-repairs.log"
          python /tmp/r2b-feature-repairs.py 2>&1 | tee "$EVIDENCE_DIR/feature-repairs.log"
          git diff --check

      - name: Install locked dependencies and boot Laravel
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install.log"
          php artisan about 2>&1 | tee "$EVIDENCE_DIR/artisan-about.log"

      - name: Run all contract audits independently
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          failures=0
          run_gate() {
            local name="$1"; shift
            set +e
            "$@" > "$EVIDENCE_DIR/${name}.log" 2>&1
            local status=$?
            set -e
            printf '%s=%s\n' "$name" "$status" | tee -a "$EVIDENCE_DIR/audit-statuses.txt"
            [ "$status" -eq 0 ] || failures=$((failures + 1))
          }
          run_gate composer-validate composer validate --strict
          run_gate composer-audit composer audit --locked
          run_gate audit-business composer audit:business
          run_gate audit-checkout composer audit:checkout
          run_gate audit-seo composer audit:seo
          run_gate audit-cooci-adoption composer audit:cooci-adoption
          run_gate audit-fulfillment composer audit:fulfillment
          run_gate audit-reviews-support composer audit:reviews-support
          run_gate audit-media-storage composer audit:media-storage
          run_gate audit-openapi composer audit:openapi
          run_gate audit-validation composer audit:validation
          run_gate audit-finance composer audit:finance
          run_gate audit-seller-operations composer audit:seller-operations
          run_gate audit-admin-operations composer audit:admin-operations
          run_gate audit-live-public composer audit:live-public
          run_gate audit-staging composer audit:staging
          find . -maxdepth 1 -type f -name '*-audit.json' -print -exec cp {} "$EVIDENCE_DIR/" \;
          echo "audit_failures=$failures" | tee "$EVIDENCE_DIR/audit-summary.txt"
          test "$failures" -eq 0

      - name: Run complete PHPUnit suite
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          php artisan test --testsuite=Unit 2>&1 | tee "$EVIDENCE_DIR/tests-unit.log"
          php artisan test 2>&1 | tee "$EVIDENCE_DIR/tests-all.log"

      - name: Enforce R2B1 scope and push
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f backend/*-audit.json backend/.env
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-after.sha256"
          cmp "$EVIDENCE_DIR/composer-before.sha256" "$EVIDENCE_DIR/composer-after.sha256"
          git diff --check
          tracked="$(git diff --name-only | sort)"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          expected_tracked=$'.github/workflows/backend-ci.yml\nbackend/app/Services/Catalog/PublicCatalogService.php\nbackend/app/Services/Checkout/QuoteService.php\nbackend/config/database.php\nbackend/scripts/audit-business-contract.php\nbackend/scripts/audit-commerce-openapi-drift.php\nbackend/scripts/audit-live-public-contract.php\nbackend/scripts/audit-validation-hardening.php\nbackend/tests/TestCase.php'
          expected_untracked=$'backend/app/Http/Controllers/Controller.php\nbackend/scripts/route-contract-support.php'
          printf '%s\n' "$tracked" | tee "$EVIDENCE_DIR/tracked-files.txt"
          printf '%s\n' "$untracked" | tee "$EVIDENCE_DIR/untracked-files.txt"
          test "$tracked" = "$expected_tracked"
          test "$untracked" = "$expected_untracked"
          git config user.name "Rosta Program Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/backend-ci.yml \
            backend/app/Http/Controllers/Controller.php \
            backend/app/Services/Catalog/PublicCatalogService.php \
            backend/app/Services/Checkout/QuoteService.php \
            backend/config/database.php \
            backend/scripts/audit-business-contract.php \
            backend/scripts/audit-commerce-openapi-drift.php \
            backend/scripts/audit-live-public-contract.php \
            backend/scripts/audit-validation-hardening.php \
            backend/scripts/route-contract-support.php \
            backend/tests/TestCase.php
          staged="$(git diff --cached --name-only | sort)"
          expected_staged=$'.github/workflows/backend-ci.yml\nbackend/app/Http/Controllers/Controller.php\nbackend/app/Services/Catalog/PublicCatalogService.php\nbackend/app/Services/Checkout/QuoteService.php\nbackend/config/database.php\nbackend/scripts/audit-business-contract.php\nbackend/scripts/audit-commerce-openapi-drift.php\nbackend/scripts/audit-live-public-contract.php\nbackend/scripts/audit-validation-hardening.php\nbackend/scripts/route-contract-support.php\nbackend/tests/TestCase.php'
          printf '%s\n' "$staged" | tee "$EVIDENCE_DIR/staged-files.txt"
          test "$staged" = "$expected_staged"
          git diff --cached --check
          git diff --cached --stat | tee "$EVIDENCE_DIR/diff-stat.txt"
          git commit -m "fix(backend): restore runtime contracts and feature test boundary"
          git push origin HEAD:"$TARGET_BRANCH"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/result-commit.txt"
          echo "ROSTA_R2B1_FEATURE_GATE_COMPLETE" | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload R2B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r2b1-evidence-${{ github.run_id }}
          path: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1
          if-no-files-found: warn
          retention-days: 14
