name: PS9 Final Pre-server Freeze

on:
  pull_request:
    branches: [integration/rosta-release-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps9-historical-freeze-${{ github.ref }}
  cancel-in-progress: true

env:
  ROSTA_PS9_TAG: rosta-pre-server-2026-09-01
  ROSTA_PS9_ACCEPTED_SHA: ab96dd2280f9e1870455cadc10297ee0fa20a308

jobs:
  historical-freeze-verification:
    name: verify-historical-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify PS9 release identity is unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "$ROSTA_PS9_TAG^{commit}")" = "$ROSTA_PS9_ACCEPTED_SHA"
          git merge-base --is-ancestor "$ROSTA_PS9_ACCEPTED_SHA" HEAD
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS9_TAG" --jq .tag_name)" = "$ROSTA_PS9_TAG"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS9_TAG" --jq .target_commitish)"
          test -n "$release_target"
          git diff --check "$ROSTA_PS9_ACCEPTED_SHA...HEAD"
          {
            echo "ROSTA_PS9_HISTORICAL_FREEZE_VERIFIED"
            echo "tag=$ROSTA_PS9_TAG"
            echo "accepted_sha=$ROSTA_PS9_ACCEPTED_SHA"
            echo "candidate_sha=$(git rev-parse HEAD)"
          }
