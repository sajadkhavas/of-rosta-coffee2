name: PS9 Final Pre-server Freeze

on:
  pull_request:
    branches: [integration/rosta-release-candidate]
  push:
    branches: [integration/rosta-release-candidate]

permissions:
  contents: read

concurrency:
  group: ps9-final-freeze-${{ github.ref }}
  cancel-in-progress: true

env:
  ROSTA_PS9_TAG: rosta-pre-server-2026-09-01
  ROSTA_PS9_BASELINE: 40154b452d78e473d4f0da1e620e63bc7ffbbacc

jobs:
  final-integrated:
    name: final-integrated-browser
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EVIDENCE_DIR: /tmp/rosta-ps9-integrated/${{ github.run_id }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      LOG_CHANNEL: stack
      LOG_STACK: single
      FRONTEND_ALLOWED_ORIGINS: http://127.0.0.1:3000
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:3000
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rosta_test
      DB_USERNAME: rosta
      DB_PASSWORD: rosta_test
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SMS_DRIVER: acceptance
      ROSTA_SMS_ENABLED: "false"
      ROSTA_PAYMENT_ENABLED: "true"
      PAYMENT_DRIVER: testing
      PAYMENT_AMOUNT_MULTIPLIER: 1
      PAYMENT_CALLBACK_URL: http://127.0.0.1:3000/checkout
      ROSTA_ALLOWED_PAYMENT_REDIRECT_HOSTS: 127.0.0.1
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      VITE_SITE_URL: https://rosta.shop
      VITE_API_URL: http://127.0.0.1:8000/api/v1
      VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:8000,rosta.shop
      VITE_ALLOW_INDEXING: "true"
      ROSTA_INTERNAL_API_URL: http://127.0.0.1:8000/api/v1
      R3C_FRONTEND_BASE: http://127.0.0.1:3000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rosta_test
          MYSQL_USER: rosta
          MYSQL_PASSWORD: rosta_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install AVIF encoder delegate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-plugin-aomenc

      - name: Freeze candidate identity and patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" test-results
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "${#CANDIDATE_SHA}" -eq 40
          test -s bun.lock
          test -s backend/composer.lock
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...$CANDIDATE_SHA"
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=integration/rosta-release-candidate -f per_page=100 \
              > "$EVIDENCE_DIR/open-release-candidate-prs.json"
            foreign_count="$(jq '[.[] | select(.number != ${{ github.event.pull_request.number }})] | length' "$EVIDENCE_DIR/open-release-candidate-prs.json")"
            test "$foreign_count" -eq 0
          else
            git diff --check HEAD^..HEAD
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f base=integration/rosta-release-candidate -f per_page=100 \
              > "$EVIDENCE_DIR/open-release-candidate-prs.json"
            test "$(jq 'length' "$EVIDENCE_DIR/open-release-candidate-prs.json")" -eq 0
          fi
          {
            echo "candidate=$CANDIDATE_SHA"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "baseline=$ROSTA_PS9_BASELINE"
            echo "tag=$ROSTA_PS9_TAG"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "php=$(php --version | head -n 1)"
            echo "composer=$(composer --version 2>&1 | head -n 1)"
          } | tee "$EVIDENCE_DIR/identity.txt"
          sha256sum package.json bun.lock backend/composer.json backend/composer.lock \
            | tee "$EVIDENCE_DIR/dependencies-before.sha256"

      - name: First and second frozen frontend install
        shell: bash
        run: |
          set -o pipefail
          rm -rf node_modules
          bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/frontend-install-1.log"
          rm -rf node_modules
          bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/frontend-install-2.log"

      - name: First and second locked backend install
        shell: bash
        run: |
          set -o pipefail
          rm -rf backend/vendor
          (cd backend && composer install --no-interaction --prefer-dist --no-progress) 2>&1 | tee "$EVIDENCE_DIR/backend-install-1.log"
          rm -rf backend/vendor
          (cd backend && composer install --no-interaction --prefer-dist --no-progress) 2>&1 | tee "$EVIDENCE_DIR/backend-install-2.log"

      - name: Prepare isolated Laravel environment
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Run independent dependency and aggregate gates
        shell: bash
        run: |
          set -o pipefail
          bun run audit:dependencies 2>&1 | tee "$EVIDENCE_DIR/bun-audit.log"
          (cd backend && composer audit --locked --no-interaction) 2>&1 | tee "$EVIDENCE_DIR/composer-audit.log"
          (cd backend && composer check) 2>&1 | tee "$EVIDENCE_DIR/backend-check.log"
          bun run check 2>&1 | tee "$EVIDENCE_DIR/frontend-check.log"

      - name: Prepare final acceptance database
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          php artisan migrate:fresh --force 2>&1 | tee "$EVIDENCE_DIR/mysql-migrations.log"
          php artisan rosta:readiness --strict --json 2>&1 | tee "$EVIDENCE_DIR/readiness.json"
          php artisan rosta:acceptance-fixtures --json > "$EVIDENCE_DIR/acceptance-fixtures.json"
          grep -q 'ROSTA_R3A_ACCEPTANCE_FIXTURES_COMPLETE' "$EVIDENCE_DIR/acceptance-fixtures.json"

      - name: Build final production SSR
        shell: bash
        env:
          NODE_ENV: production
          NITRO_PRESET: node-server
        run: |
          set -o pipefail
          bun run build 2>&1 | tee "$EVIDENCE_DIR/frontend-build.log"
          test -s .output/server/index.mjs
          git diff -- src/routeTree.gen.ts | tee "$EVIDENCE_DIR/route-tree.diff"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium 2>&1 | tee "$EVIDENCE_DIR/playwright-install.log"

      - name: Boot final integrated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd backend && php artisan serve --host=127.0.0.1 --port=8000) > "$EVIDENCE_DIR/laravel-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/laravel.pid"
          (cd backend && php artisan queue:work redis --queue=notifications --sleep=1 --tries=1 --timeout=30) > "$EVIDENCE_DIR/queue-worker.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/worker.pid"
          NODE_ENV=production HOST=127.0.0.1 PORT=3000 node .output/server/index.mjs > "$EVIDENCE_DIR/frontend-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/frontend.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live >/dev/null \
              && curl --fail --silent http://127.0.0.1:3000/robots.txt >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$EVIDENCE_DIR/laravel-runtime.log"
          cat "$EVIDENCE_DIR/frontend-runtime.log"
          exit 1

      - name: Run every real browser journey
        shell: bash
        run: |
          set -o pipefail
          export R3C_JUNIT_PATH="$EVIDENCE_DIR/ps9-browser-junit.xml"
          bun run test:browser -- --config=playwright.config.ts 2>&1 | tee "$EVIDENCE_DIR/browser.log"
          grep -q 'failures="0"' "$EVIDENCE_DIR/ps9-browser-junit.xml"
          kill -0 "$(cat "$EVIDENCE_DIR/laravel.pid")"
          kill -0 "$(cat "$EVIDENCE_DIR/worker.pid")"
          kill -0 "$(cat "$EVIDENCE_DIR/frontend.pid")"

      - name: Seal integrated evidence
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in laravel.pid worker.pid frontend.pid; do
            if [[ -s "$EVIDENCE_DIR/$pidfile" ]]; then kill "$(cat "$EVIDENCE_DIR/$pidfile")" 2>/dev/null || true; fi
          done
          set -e
          cp dependency-audit.log "$EVIDENCE_DIR/" 2>/dev/null || true
          cp r3d-final-integration-audit.json "$EVIDENCE_DIR/" 2>/dev/null || true
          cp bundle-report.json "$EVIDENCE_DIR/" 2>/dev/null || true
          rm -f dependency-audit.log ./*-audit.json ./r3*.json ./r4*.json bundle-report.json backend/.env backend/*-audit.json
          rm -rf backend/storage/framework/cache/phpstan backend/storage/framework/testing test-results
          if ! git diff --quiet -- src/routeTree.gen.ts; then git checkout -- src/routeTree.gen.ts; fi
          sha256sum package.json bun.lock backend/composer.json backend/composer.lock \
            | tee "$EVIDENCE_DIR/dependencies-after.sha256"
          cmp "$EVIDENCE_DIR/dependencies-before.sha256" "$EVIDENCE_DIR/dependencies-after.sha256"
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|\bsk-(proj-)?[A-Za-z0-9_-]{20,}' "$EVIDENCE_DIR"; then
            echo "Sensitive material entered PS9 integrated evidence." >&2
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload integrated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps9-integrated-${{ github.run_id }}
          path: /tmp/rosta-ps9-integrated/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30

  final-staging:
    name: final-staging-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EVIDENCE_DIR: /tmp/rosta-ps9-staging/${{ github.run_id }}
      ROSTA_ALLOW_REHEARSAL: "true"
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install AVIF encoder delegate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-plugin-aomenc

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bun install --frozen-lockfile
          (cd backend && composer install --no-interaction --prefer-dist --no-progress)

      - name: Audit and rehearse complete staging package
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run audit:r4a 2>&1 | tee /tmp/ps9-r4a-audit.log
          (cd backend && composer audit:staging) 2>&1 | tee /tmp/ps9-backend-staging-audit.log
          bash deploy/staging/rehearsal.sh
          grep -q 'ROSTA_R4A_STAGING_PACKAGE_COMPLETE' "$EVIDENCE_DIR/result.txt"
          test -s "$EVIDENCE_DIR/restore-drill.txt"
          test -s "$EVIDENCE_DIR/release-state.txt"
          grep -q '^current=' "$EVIDENCE_DIR/release-state.txt"
          grep -q '^previous=r4a-baseline$' "$EVIDENCE_DIR/release-state.txt"

      - name: Seal staging evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/ps9-r4a-audit.log "$EVIDENCE_DIR/" 2>/dev/null || true
          cp /tmp/ps9-backend-staging-audit.log "$EVIDENCE_DIR/" 2>/dev/null || true
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|S3_SECRET_ACCESS_KEY=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=' "$EVIDENCE_DIR"; then
            echo "Sensitive material entered PS9 staging evidence." >&2
            exit 1
          fi
          rm -f ./*-audit.json ./r4*.json backend/*-audit.json
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps9-staging-${{ github.run_id }}
          path: /tmp/rosta-ps9-staging/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30

  final-production:
    name: final-production-package
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EVIDENCE_DIR: /tmp/rosta-ps9-production/${{ github.run_id }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROSTA_ALLOW_REHEARSAL: "true"
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Install production contract tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Freeze production identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          sha256sum Dockerfile.production backend/Dockerfile.production package.json bun.lock backend/composer.json backend/composer.lock deploy/production/docker-compose.yml deploy/production/Caddyfile \
            | tee "$EVIDENCE_DIR/production-inputs.sha256"

      - name: Run production topology and package contracts
        shell: bash
        run: |
          set -o pipefail
          PS8C_AUDIT_OUTPUT="$EVIDENCE_DIR/infrastructure-audit.json" bash deploy/production/infrastructure-audit.sh \
            2>&1 | tee "$EVIDENCE_DIR/infrastructure-audit.log"
          grep -q 'ROSTA_PS8C_INFRASTRUCTURE_TOPOLOGY_CLEAN' "$EVIDENCE_DIR/infrastructure-audit.log"
          bash deploy/production/contract-test.sh 2>&1 | tee "$EVIDENCE_DIR/production-contract.log"
          bash deploy/production/rehearsal.sh 2>&1 | tee "$EVIDENCE_DIR/production-edge-rehearsal.log"
          grep -q 'production edge rehearsal passed' "$EVIDENCE_DIR/production-edge-rehearsal.log"

      - name: Build exact production application images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --file Dockerfile.production \
            --build-arg VITE_SITE_URL=https://rosta.shop \
            --build-arg VITE_API_URL=https://api.rosta.shop/api/v1 \
            --build-arg VITE_PAYMENT_REDIRECT_HOSTS=rosta.shop,api.rosta.shop,zarinpal.com,www.zarinpal.com \
            --build-arg VITE_ALLOW_INDEXING=true \
            --tag "rosta-frontend:$CANDIDATE_SHA" . \
            2>&1 | tee "$EVIDENCE_DIR/frontend-image-build.log"
          docker build --file backend/Dockerfile.production --target app \
            --tag "rosta-api:$CANDIDATE_SHA" backend \
            2>&1 | tee "$EVIDENCE_DIR/api-image-build.log"
          docker build --file backend/Dockerfile.production --target web \
            --tag "rosta-api-web:$CANDIDATE_SHA" backend \
            2>&1 | tee "$EVIDENCE_DIR/api-web-image-build.log"
          for image in "rosta-frontend:$CANDIDATE_SHA" "rosta-api:$CANDIDATE_SHA" "rosta-api-web:$CANDIDATE_SHA"; do
            docker image inspect "$image" >/dev/null
          done
          test "$(docker image inspect "rosta-api:$CANDIDATE_SHA" --format '{{.Config.User}}')" = 'www-data'
          test "$(docker image inspect "rosta-frontend:$CANDIDATE_SHA" --format '{{.Config.User}}')" = 'node'

      - name: Enforce production evidence privacy and clean source
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|S3_SECRET_ACCESS_KEY=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=' "$EVIDENCE_DIR"; then
            echo "Sensitive material entered PS9 production evidence." >&2
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps9-production-${{ github.run_id }}
          path: /tmp/rosta-ps9-production/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30

  release-evidence:
    name: final-release-evidence
    needs: [final-integrated, final-staging, final-production]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_DIR: /tmp/rosta-ps9-release/${{ github.run_id }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact accepted candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Generate SPDX SBOM from exact workspace
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: ps9-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22

      - name: Build and create release manifest
        shell: bash
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: https://api.rosta.shop/api/v1
          VITE_PAYMENT_REDIRECT_HOSTS: rosta.shop,api.rosta.shop,zarinpal.com,www.zarinpal.com
          VITE_ALLOW_INDEXING: "true"
          NODE_ENV: production
          NITRO_PRESET: node-server
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          bun install --frozen-lockfile
          bun run build
          GITHUB_SHA="$CANDIDATE_SHA" bun run release:manifest -- .output "$EVIDENCE_DIR/frontend-release-manifest.json"
          mv ps9-sbom.spdx.json "$EVIDENCE_DIR/rosta-$CANDIDATE_SHA.spdx.json"

      - name: Seal PRE-SERVER GO evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          cat > "$EVIDENCE_DIR/ps9-final-acceptance.json" <<JSON
          {
            "schema": "rosta.ps9-final-acceptance.v1",
            "verdict": "PRE-SERVER GO",
            "candidate_sha": "$CANDIDATE_SHA",
            "tree_sha": "$tree",
            "baseline_sha": "$ROSTA_PS9_BASELINE",
            "freeze_tag": "$ROSTA_PS9_TAG",
            "workflow_run": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "integrated_browser_gate": "PASS",
            "staging_rehearsal": "PASS",
            "production_package_rehearsal": "PASS",
            "real_server_activated": false,
            "external_provider_activation_claimed": false
          }
          JSON
          sha256sum \
            package.json bun.lock backend/composer.json backend/composer.lock \
            Dockerfile.production backend/Dockerfile.production \
            deploy/production/docker-compose.yml deploy/production/Caddyfile \
            docs/pre-server/FINAL_PRE_SERVER_ACCEPTANCE.md \
            docs/pre-server/PS9_RELEASE_NOTES.md \
            "$EVIDENCE_DIR/frontend-release-manifest.json" \
            "$EVIDENCE_DIR/rosta-$CANDIDATE_SHA.spdx.json" \
            "$EVIDENCE_DIR/ps9-final-acceptance.json" \
            > "$EVIDENCE_DIR/ps9-checksums.sha256"
          {
            echo "# PS9 Final Evidence"
            echo
            echo "- Verdict: PRE-SERVER GO"
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Tree SHA: \`$tree\`"
            echo "- Baseline: \`$ROSTA_PS9_BASELINE\`"
            echo "- Freeze tag: \`$ROSTA_PS9_TAG\`"
            echo "- Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Real server activated: no"
            echo "- External provider activation claimed: no"
          } > "$EVIDENCE_DIR/PS9_FINAL_EVIDENCE.md"
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|S3_SECRET_ACCESS_KEY=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|\bsk-(proj-)?[A-Za-z0-9_-]{20,}' "$EVIDENCE_DIR"; then
            echo "Sensitive material entered PS9 release evidence." >&2
            exit 1
          fi
          git diff --check

      - name: Upload final release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps9-release-evidence-${{ github.run_id }}
          path: /tmp/rosta-ps9-release/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

  finalize-freeze:
    name: create-immutable-tag-and-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration/rosta-release-candidate'
    needs: [release-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout final integration SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Download sealed release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rosta-ps9-release-evidence-${{ github.run_id }}
          path: release-evidence

      - name: Create or verify immutable freeze tag
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --force --tags origin
          if git rev-parse --verify "$ROSTA_PS9_TAG^{commit}" >/dev/null 2>&1; then
            existing="$(git rev-parse "$ROSTA_PS9_TAG^{commit}")"
            test "$existing" = "$CANDIDATE_SHA" || {
              echo "Freeze tag already protects a different SHA: $existing" >&2
              exit 1
            }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$ROSTA_PS9_TAG" "$CANDIDATE_SHA" \
              -m "ROSTA PS9 PRE-SERVER GO — immutable pre-server freeze"
            git push origin "refs/tags/$ROSTA_PS9_TAG"
          fi
          git fetch --force --tags origin
          resolved="$(git rev-parse "$ROSTA_PS9_TAG^{commit}")"
          test "$resolved" = "$CANDIDATE_SHA"
          remote="$(git ls-remote origin "refs/tags/$ROSTA_PS9_TAG^{}" | awk 'NR==1{print $1}')"
          if [[ -z "$remote" ]]; then
            remote="$(git ls-remote origin "refs/tags/$ROSTA_PS9_TAG" | awk 'NR==1{print $1}')"
          fi
          test -n "$remote"
          cat > freeze-proof.json <<JSON
          {
            "schema": "rosta.ps9-freeze-proof.v1",
            "verdict": "PRE-SERVER GO",
            "tag": "$ROSTA_PS9_TAG",
            "commit": "$resolved",
            "tree": "$(git rev-parse 'HEAD^{tree}')",
            "workflow_run": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "real_server_activated": false
          }
          JSON
          sha256sum release-evidence/* freeze-proof.json > ps9-release-assets.sha256

      - name: Publish or verify GitHub release
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$ROSTA_PS9_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS9_TAG" --jq .tag_name)" = "$ROSTA_PS9_TAG"
          else
            gh release create "$ROSTA_PS9_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ROSTA Pre-server Freeze — 2026-09-01" \
              --notes-file docs/pre-server/PS9_RELEASE_NOTES.md
          fi
          gh release upload "$ROSTA_PS9_TAG" --repo "$GITHUB_REPOSITORY" \
            release-evidence/* freeze-proof.json ps9-release-assets.sha256 --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS9_TAG" \
            --jq '{tag_name: .tag_name, html_url: .html_url, published_at: .published_at}'
