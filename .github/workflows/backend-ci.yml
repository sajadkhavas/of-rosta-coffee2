name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rosta_test
          MYSQL_USER: rosta
          MYSQL_PASSWORD: rosta_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      EVIDENCE_DIR: /tmp/rosta-r3-evidence/${{ github.run_id }}/r3a
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      LOG_STACK: single
      FRONTEND_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rosta_test
      DB_USERNAME: rosta
      DB_PASSWORD: rosta_test
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_PROCESS_TIMEOUT: "900"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Freeze exact backend snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -s composer.lock
          test -z "$(git status --porcelain)"
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);'
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "php=$(php --version | head -n 1)"
            echo "composer=$(composer --version 2>&1 | head -n 1)"
          } | tee "$EVIDENCE_DIR/snapshot.txt"
          sha256sum composer.json composer.lock | tee "$EVIDENCE_DIR/composer-before.sha256"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare isolated environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: First clean locked install
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install-1.log"
          php artisan about 2>&1 | tee "$EVIDENCE_DIR/artisan-about-1.log"

      - name: Second clean locked install
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install-2.log"
          php artisan about 2>&1 | tee "$EVIDENCE_DIR/artisan-about-2.log"
          sha256sum composer.json composer.lock | tee "$EVIDENCE_DIR/composer-after-installs.sha256"
          cmp "$EVIDENCE_DIR/composer-before.sha256" "$EVIDENCE_DIR/composer-after-installs.sha256"

      - name: Validate frozen application contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ../docs/openapi/rosta-v1-phase6.yaml
          test -s ../docs/openapi/rosta-v1-commerce-additions.yaml
          test -s ../docs/openapi/rosta-v1-finance.yaml
          test -s ../docs/openapi/rosta-v1-seller-operations.yaml
          test -s ../docs/openapi/rosta-v1-admin-operations.yaml
          grep -q '^ROSTA_CONTRACT_VERSION=2026-07-21-phase-6$' .env.example
          grep -q '"laravel/framework": "^13.8"' composer.json
          test "$ROSTA_PAYMENT_ENABLED" = "false"
          test "$ROSTA_REFUND_ENABLED" = "false"
          test "$ROSTA_SMS_ENABLED" = "false"
          test "$ROSTA_MEDIA_UPLOADS_ENABLED" = "false"

      - name: Run clean MySQL migrations
        shell: bash
        run: |
          set -o pipefail
          php artisan migrate:fresh --force 2>&1 | tee "$EVIDENCE_DIR/mysql-migrations.log"

      - name: Verify strict readiness
        shell: bash
        run: |
          set -o pipefail
          php artisan rosta:readiness --strict --json 2>&1 | tee "$EVIDENCE_DIR/backend-readiness.json"

      - name: Exercise Redis runtime contracts
        shell: bash
        run: |
          set -o pipefail
          composer acceptance:infrastructure 2>&1 | tee "$EVIDENCE_DIR/infrastructure-acceptance.json"
          grep -q 'ROSTA_R2C_INFRASTRUCTURE_COMPLETE' "$EVIDENCE_DIR/infrastructure-acceptance.json"

      - name: Run every backend audit independently
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict 2>&1 | tee "$EVIDENCE_DIR/composer-validate.log"
          composer audit --locked 2>&1 | tee "$EVIDENCE_DIR/composer-audit.log"
          for gate in business checkout seo cooci-adoption fulfillment reviews-support media-storage openapi validation finance seller-operations admin-operations live-public staging encrypted-storage acceptance-fixtures; do
            composer "audit:$gate" 2>&1 | tee "$EVIDENCE_DIR/audit-$gate.log"
          done

      - name: Run tests independently
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee "$EVIDENCE_DIR/tests.log"

      - name: Run PHPStan independently
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/phpstan analyse --memory-limit=1G --error-format=table 2>&1 | tee "$EVIDENCE_DIR/phpstan.log"

      - name: Run Pint independently
        shell: bash
        run: |
          set -o pipefail
          php vendor/bin/pint --parallel --test 2>&1 | tee "$EVIDENCE_DIR/pint.log"

      - name: Run aggregate Composer gate once
        shell: bash
        run: |
          set -o pipefail
          composer check 2>&1 | tee "$EVIDENCE_DIR/composer-check.log"

      - name: Seed and verify R3A acceptance fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          php artisan migrate:fresh --force 2>&1 | tee "$EVIDENCE_DIR/acceptance-migrations.log"
          composer acceptance:fixtures 2>&1 | tee "$EVIDENCE_DIR/acceptance-fixtures.json"
          grep -q '"ready": true' "$EVIDENCE_DIR/acceptance-fixtures.json"
          grep -q 'ROSTA_R3A_ACCEPTANCE_FIXTURES_COMPLETE' "$EVIDENCE_DIR/acceptance-fixtures.json"

      - name: Enforce clean scope and emit backend markers
        shell: bash
        run: |
          set -Eeuo pipefail
          cp storage/logs/*.log "$EVIDENCE_DIR/" 2>/dev/null || true
          rm -f .env *-audit.json
          rm -rf storage/framework/testing storage/framework/cache/phpstan
          sha256sum composer.json composer.lock | tee "$EVIDENCE_DIR/composer-final.sha256"
          cmp "$EVIDENCE_DIR/composer-before.sha256" "$EVIDENCE_DIR/composer-final.sha256"
          git diff --check
          git status --short --untracked-files=all | tee "$EVIDENCE_DIR/git-status-final.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo "backend_foundation=ready"
            echo "ROSTA_R3A_ACCEPTANCE_FIXTURES_COMPLETE"
          } | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload backend and R3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r3a-backend-${{ github.run_id }}
          path: /tmp/rosta-r3-evidence/${{ github.run_id }}/r3a
          if-no-files-found: warn
          retention-days: 14
