name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi/rosta-v1-phase6.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi/rosta-v1-phase6.yaml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rosta_test
          MYSQL_USER: rosta
          MYSQL_PASSWORD: rosta_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://127.0.0.1:3000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rosta_test
      DB_USERNAME: rosta
      DB_PASSWORD: rosta_test
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, json, mbstring, openssl, pdo_mysql, redis, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate frozen contract marker
        run: |
          test -s ../docs/openapi/rosta-v1-phase6.yaml
          grep -q '^ROSTA_CONTRACT_VERSION=2026-07-21-phase-6$' .env.example

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: composer test

      - name: Run static analysis
        run: composer analyse

      - name: Check formatting
        run: vendor/bin/pint --test
