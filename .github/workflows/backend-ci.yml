name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rosta_test
          MYSQL_USER: rosta
          MYSQL_PASSWORD: rosta_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      LOG_STACK: single
      FRONTEND_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rosta_test
      DB_USERNAME: rosta
      DB_PASSWORD: rosta_test
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Create ephemeral application key
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Require deterministic dependency lock
        run: test -s composer.lock

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate frozen contract marker
        run: |
          test -s ../docs/openapi/rosta-v1-phase6.yaml
          test -s ../docs/openapi/rosta-v1-commerce-additions.yaml
          test -s ../docs/openapi/rosta-v1-finance.yaml
          test -s ../docs/openapi/rosta-v1-seller-operations.yaml
          test -s ../docs/openapi/rosta-v1-admin-operations.yaml
          grep -q '^ROSTA_CONTRACT_VERSION=2026-07-21-phase-6$' .env.example
          grep -q '"laravel/framework": "^13.8"' composer.json

      - name: Run MySQL migrations
        run: php artisan migrate --force

      - name: Run backend quality gate
        run: composer check

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-${{ github.run_id }}
          path: |
            backend/*-audit.json
            backend/storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
