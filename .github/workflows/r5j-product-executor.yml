name: Temporary R5J Product Executor

on:
  pull_request:
    branches: [integration/rosta-r5-marketplace]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5j-product-executor-pr
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.head_ref == 'program/r5j-rosta-hub-operations'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact R5J branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          coverage: none
      - name: Apply, verify and publish R5J
        id: executor
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/r5j-product-executor.log) 2>&1

          verify_apply() {
            local source="$1" bytes="$2" sha256="$3" blob="$4"
            test "$(wc -c < "$source")" = "$bytes"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$sha256"
            test "$(git hash-object "$source")" = "$blob"
            git apply --check "$source"
            git apply "$source"
          }

          cat scripts/r5j-payload/part-* > /tmp/r5j-product.patch.gz.b64
          test "$(wc -c < /tmp/r5j-product.patch.gz.b64)" = "27424"
          test "$(sha256sum /tmp/r5j-product.patch.gz.b64 | awk '{print $1}')" = "83e3b5272f90fbb56034e9ea144fdb54bcfcc0464efba5d363d67eb0a359129b"
          test "$(git hash-object /tmp/r5j-product.patch.gz.b64)" = "1a34b16e783e3c7bfd51ae43f51d97bfc7cd13bd"
          base64 -d /tmp/r5j-product.patch.gz.b64 | gzip -d > /tmp/r5j-product.patch
          git apply --check /tmp/r5j-product.patch
          git apply /tmp/r5j-product.patch

          verify_apply scripts/r5j-payload/correction-01.patch 909 0f7299f61d050f9a8ec78958d6e440af2768ce8bf053d1d9fafee39d78d228c9 f49d41a8cb1c7dce3505c0ff3f9ffa51c6a6e3d4
          verify_apply scripts/r5j-payload/correction-02.patch 255 a04ad5d29f19157ee1363ac2db2d36daffce80ba082c5e1e736a5f5299e14467 ecfe381e773c6eb70ba6490d5c51aed3b407113d
          verify_apply scripts/r5j-payload/correction-03.patch 780 7228ec4780a1cebb9fa7831352638d9a2eb058b3e5c93cf7b56e6452fb4c926c d8c637134a63b8a8f322d9d9991e20f5d89f636f
          verify_apply scripts/r5j-payload/correction-04.patch 1111 1d6fee4e2cd82204d6095891e113c0e6cd8a115eb5eaa71c4591c659dcc6c0c5 6c0127232028da8577684370d6f59bd9527bb1dd
          verify_apply scripts/r5j-payload/correction-05.patch 1957 442c013f943d7c43e172f71c2f8044cb2170e5dd7a762c59e00c0066c4e6dbdc db51dfc5e64ad55a8d12392e5d7a32481dcd9c76
          verify_apply scripts/r5j-payload/correction-06.patch 1080 e39aed3e9b53fe9f66382f696d8cbdc20cbedb96ad822f215dbd9c0db47652ca e74fca857c508f2d561423c9cd8523082e3f4be5
          verify_apply scripts/r5j-payload/correction-07.patch 835 dc8ebf36cfd3536701dcfa1ce94cec533184caf3d4fbacb0572f02131ba8da19 11211c4f711f9cd69650073165b1fd82a70daaa1
          verify_apply scripts/r5j-payload/correction-08.patch 1634 d6c19a0f71806c60fd71a00f889954e9d9144b7ab1cef1e9d6ebf63292c08eb0 3398ed5acd593b4dc60da24e8098d2396af6ef5c

          bun install --frozen-lockfile
          (cd backend && composer install --no-interaction --no-progress --prefer-dist)

          base='adcdcfcf6094fdc9a4ccc76fad4b1d0b453faaed'
          mapfile -t frontend_files < <(git diff --name-only "$base" -- '*.ts' '*.tsx' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' | while read -r file; do test -f "$file" && printf '%s\n' "$file"; done)
          if ((${#frontend_files[@]})); then bunx prettier --write "${frontend_files[@]}"; fi
          (cd backend && vendor/bin/pint)

          bun run audit:r5j
          bun test tests/unit/r5j-hub-operations.test.ts tests/unit/financial-contracts.test.ts
          bun run routes:generate
          bun run typecheck
          (
            cd backend
            composer audit:r5j
            composer audit:encrypted-storage
            composer audit:openapi
            composer audit:r5g
            composer audit:r5i
            php artisan test --filter=R5JRostaHubOperationsTest
            php artisan test --filter=R5GRostaHubGrindingTest
            php artisan test --filter=R5IDeliverySettlementTest
            vendor/bin/phpstan analyse --memory-limit=1G
            vendor/bin/pint --parallel --test
          )

          rm -rf scripts/r5j-payload
          rm -f .github/workflows/r5j-source-export.yml .github/workflows/r5j-product-executor.yml
          find backend -maxdepth 1 -type f -name '*audit.json' -delete
          rm -rf backend/.phpstan.cache backend/storage/framework/cache/phpstan

          git config user.name "Rosta R5J Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "R5J implement Rosta Hub operations and chain of custody"
          git push origin HEAD:program/r5j-rosta-hub-operations
      - name: Upload R5J executor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5j-product-executor-${{ github.sha }}
          path: /tmp/r5j-product-executor.log
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce R5J executor
        if: always()
        shell: bash
        run: test "${{ steps.executor.outcome }}" = "success"
