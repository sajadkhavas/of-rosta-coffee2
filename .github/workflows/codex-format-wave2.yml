name: Codex Wave 2 formatter

on:
  push:
    branches:
      - phase/rosta-ps5a-quiz-reviews

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PS5.1
        uses: actions/checkout@v4
        with:
          path: ps51
          fetch-depth: 0
      - name: Checkout PS5.2
        uses: actions/checkout@v4
        with:
          ref: phase/rosta-ps5b-seller-organization
          path: ps52
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Format phase-owned frontend files
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline=2a6f583b4c2f707104b53bf67cdbcc7eff1276dc
          for phase in ps51 ps52; do
            cd "$GITHUB_WORKSPACE/$phase"
            bun install --frozen-lockfile
            git diff --name-only -z "$baseline...HEAD" -- '*.js' '*.jsx' '*.mjs' '*.ts' '*.tsx' '*.json' \
              | xargs -0 -r bun x prettier --write
            git diff --binary > "$GITHUB_WORKSPACE/${phase}-format.patch"
          done
      - name: Upload formatter patches
        uses: actions/upload-artifact@v4
        with:
          name: wave2-formatter-patches
          path: |
            ps51-format.patch
            ps52-format.patch
          if-no-files-found: error
          retention-days: 1
