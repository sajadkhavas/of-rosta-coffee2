name: Pint Diagnostic

on:
  push:
    branches:
      - phase/rosta-ps5c-carrier-admin-ops-r2

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, imagick, intl, json, mbstring, openssl, pcntl, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate exact Pint diff
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ./vendor/bin/pint app/Services/Carrier/CarrierOperationsService.php
          git diff -- app/Services/Carrier/CarrierOperationsService.php > ../pint.patch
          cat ../pint.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pint-diagnostic-patch
          path: pint.patch
          if-no-files-found: error
