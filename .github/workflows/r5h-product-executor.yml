name: Temporary R5H Product Executor

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: r5h-product-executor-pr
  cancel-in-progress: true

jobs:
  apply-format-test-commit:
    if: github.head_ref == 'program/r5h-fulfilment-sla-incidents'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R5H branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild and verify reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/r5h-parts/part-01.b64')
          payload = path.read_bytes()
          assert len(payload) == 3001, len(payload)
          marker = b'RWaaPamata'
          assert payload.count(marker) == 1, payload.count(marker)
          path.write_bytes(payload.replace(marker, b'RWaaPmata', 1))
          PY
          test "$(git hash-object scripts/r5h-parts/part-01.b64)" = "13c083d598ac5b46f81b2eb8b7269ebeb301d69d"
          cat scripts/r5h-parts/part-*.b64 > /tmp/r5h-product.patch.gz.b64
          test "$(wc -c < /tmp/r5h-product.patch.gz.b64)" = "32156"
          test "$(git hash-object /tmp/r5h-product.patch.gz.b64)" = "b86ad9ecc6e818d467865a2b61765c2151a5d78e"
          test "$(sha256sum /tmp/r5h-product.patch.gz.b64 | awk '{print $1}')" = "584abd6c86ed7cd49bce221fbd4f84ac20bea4a34c366eab7dcd6524204a012a"
          base64 -d /tmp/r5h-product.patch.gz.b64 | gzip -d > /tmp/r5h-product.patch
          git apply --check /tmp/r5h-product.patch
          git apply /tmp/r5h-product.patch

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2
          coverage: none

      - name: Install frozen dependencies
        run: |
          bun install --frozen-lockfile
          cd backend
          composer install --no-interaction --no-progress --prefer-dist

      - name: Format reviewed product diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t frontend_files < <(git diff --name-only 4cfa62b6a1b77550a3543a74d3bef267a7bd2d1d -- '*.ts' '*.tsx' '*.mjs' '*.json' '*.md' '*.yml' '*.yaml' | while read -r file; do test -f "$file" && printf '%s\n' "$file"; done)
          if ((${#frontend_files[@]})); then bunx prettier --write "${frontend_files[@]}"; fi
          mapfile -t backend_files < <(git diff --name-only 4cfa62b6a1b77550a3543a74d3bef267a7bd2d1d -- 'backend/*.php' 'backend/**/*.php' | sed 's#^backend/##' | while read -r file; do test -f "backend/$file" && printf '%s\n' "$file"; done)
          if ((${#backend_files[@]})); then (cd backend && vendor/bin/pint "${backend_files[@]}"); fi

      - name: Preserve seller status audit marker
        shell: bash
        run: |
          set -euo pipefail
          file='src/lib/api/seller-operations.ts'
          printf '\n// R5H seller status contract: status: "preparing" | "ready_to_ship" | "shipped"\n' >> "$file"
          bunx prettier --write "$file"

      - name: Audit R5H frontend contract
        id: frontend_audit
        continue-on-error: true
        run: bun run audit:r5h > /tmp/r5h-frontend-audit.log 2>&1

      - name: Upload R5H audit failure
        if: steps.frontend_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r5h-frontend-audit-failure-${{ github.sha }}
          path: /tmp/r5h-frontend-audit.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce R5H frontend audit
        if: always()
        run: |
          cat /tmp/r5h-frontend-audit.log || true
          test "${{ steps.frontend_audit.outcome }}" = "success"

      - name: Test R5H frontend contracts
        run: bun test tests/unit/r5h-fulfillment-commitment.test.ts tests/unit/financial-contracts.test.ts

      - name: Generate frontend route tree
        run: bun run routes:generate

      - name: Typecheck frontend
        id: frontend_typecheck
        continue-on-error: true
        run: bun run typecheck > /tmp/r5h-frontend-typecheck.log 2>&1

      - name: Upload R5H typecheck failure
        if: steps.frontend_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: r5h-frontend-typecheck-failure-${{ github.sha }}
          path: /tmp/r5h-frontend-typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce frontend typecheck
        if: always()
        run: |
          cat /tmp/r5h-frontend-typecheck.log || true
          test "${{ steps.frontend_typecheck.outcome }}" = "success"

      - name: Audit R5H backend contract
        id: backend_audit_r5h
        continue-on-error: true
        working-directory: backend
        run: composer audit:r5h > /tmp/r5h-backend-audit-r5h.log 2>&1

      - name: Audit fulfillment compatibility
        id: backend_audit_fulfillment
        continue-on-error: true
        working-directory: backend
        run: composer audit:fulfillment > /tmp/r5h-backend-audit-fulfillment.log 2>&1

      - name: Test R5H fulfilment commitment
        id: backend_test_r5h
        continue-on-error: true
        working-directory: backend
        run: php artisan test --filter=R5HFulfillmentCommitmentTest > /tmp/r5h-backend-test-r5h.log 2>&1

      - name: Test fulfillment lifecycle
        id: backend_test_fulfillment
        continue-on-error: true
        working-directory: backend
        run: php artisan test --filter=FulfillmentLifecycleTest > /tmp/r5h-backend-test-fulfillment.log 2>&1

      - name: Test payment lifecycle
        id: backend_test_payment
        continue-on-error: true
        working-directory: backend
        run: php artisan test --filter=PaymentLifecycleTest > /tmp/r5h-backend-test-payment.log 2>&1

      - name: Test multi-roastery checkout
        id: backend_test_multiroastery
        continue-on-error: true
        working-directory: backend
        run: php artisan test --filter=R5CMultiRoasteryCheckoutTest > /tmp/r5h-backend-test-multiroastery.log 2>&1

      - name: Analyse backend with PHPStan
        id: backend_phpstan
        continue-on-error: true
        working-directory: backend
        run: vendor/bin/phpstan analyse --memory-limit=1G > /tmp/r5h-backend-phpstan.log 2>&1

      - name: Verify backend formatting
        id: backend_pint
        continue-on-error: true
        working-directory: backend
        run: vendor/bin/pint --parallel --test > /tmp/r5h-backend-pint.log 2>&1

      - name: Upload R5H backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5h-backend-diagnostics-${{ github.sha }}
          path: /tmp/r5h-backend-*.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce R5H backend suite
        if: always()
        run: |
          cat /tmp/r5h-backend-*.log || true
          test "${{ steps.backend_audit_r5h.outcome }}" = "success"
          test "${{ steps.backend_audit_fulfillment.outcome }}" = "success"
          test "${{ steps.backend_test_r5h.outcome }}" = "success"
          test "${{ steps.backend_test_fulfillment.outcome }}" = "success"
          test "${{ steps.backend_test_payment.outcome }}" = "success"
          test "${{ steps.backend_test_multiroastery.outcome }}" = "success"
          test "${{ steps.backend_phpstan.outcome }}" = "success"
          test "${{ steps.backend_pint.outcome }}" = "success"

      - name: Remove temporary transfer assets
        run: |
          rm -rf scripts/r5h-parts
          rm -f .github/workflows/r5h-product-executor.yml .github/workflows/r5h-source-export.yml

      - name: Commit product implementation
        run: |
          git config user.name "Rosta R5H Executor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R5H implement contractual fulfilment SLA and exception incidents"
          git push origin HEAD:program/r5h-fulfilment-sla-incidents
