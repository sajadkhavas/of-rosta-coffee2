name: Phase 17 Bootstrap

on:
  push:
    branches:
      - agent/phase-17-release-baseline-staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase17-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-locks-and-routes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-17-release-baseline-staging
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Generate deterministic Composer lock
        working-directory: backend
        run: composer update --no-install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate TanStack route tree
        run: bunx @tanstack/router-cli@1.170.16 generate

      - name: Validate generated files
        run: |
          test -s backend/composer.lock
          test -s src/routeTree.gen.ts
          git diff --check

      - name: Commit generated release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock src/routeTree.gen.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git commit -m "build: generate Phase 17 lockfile and route tree"
          git push origin HEAD:agent/phase-17-release-baseline-staging
