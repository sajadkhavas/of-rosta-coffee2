name: PS8C Infrastructure Acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "backend/**"
      - "deploy/production/**"
      - "Dockerfile.production"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "vite.config.*"
      - "tsconfig*.json"
      - "docs/PS8C_INFRASTRUCTURE_ACCEPTANCE.md"
      - ".github/workflows/production-package-ci.yml"
      - ".github/workflows/ps8c-infrastructure-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps8c-infrastructure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_DIR: /tmp/rosta-ps8c-evidence/${{ github.run_id }}
      ENV_DIR: /tmp/rosta-ps8c-runtime/${{ github.run_id }}
      STATE_DIR: /tmp/rosta-ps8c-state/${{ github.run_id }}

    steps:
      - name: Checkout infrastructure candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install infrastructure contract tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Freeze immutable infrastructure snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" "$ENV_DIR" "$STATE_DIR"
          test -z "$(git status --porcelain --untracked-files=all)"
          candidate="$(git rev-parse HEAD)"
          test "${#candidate}" -eq 40
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          {
            echo "candidate=$candidate"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "docker=$(docker --version)"
            echo "compose=$(docker compose version)"
            echo "shellcheck=$(shellcheck --version | awk '/version:/ {print $2; exit}')"
          } | tee "$EVIDENCE_DIR/identity.txt"
          sha256sum \
            Dockerfile.production \
            backend/Dockerfile.production \
            backend/composer.lock \
            package.json \
            bun.lock \
            deploy/production/docker-compose.yml \
            deploy/production/Caddyfile \
            | tee "$EVIDENCE_DIR/inputs-before.sha256"

      - name: Materialize secret-safe disposable production environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp deploy/production/frontend.env.example "$ENV_DIR/frontend.env"
          cp deploy/production/backend.env.example "$ENV_DIR/backend.env"

          app_key="base64:$(openssl rand -base64 32 | tr -d '\n')"
          sed -i \
            -e "s|^COMPOSE_PROJECT_NAME=.*|COMPOSE_PROJECT_NAME=rosta-ps8c-${GITHUB_RUN_ID}|" \
            -e "s|^ROSTA_IMAGE_TAG=.*|ROSTA_IMAGE_TAG=${CANDIDATE_SHA}|" \
            -e "s|^ROSTA_BACKEND_ENV_FILE=.*|ROSTA_BACKEND_ENV_FILE=${ENV_DIR}/backend.env|" \
            -e "s|^ACME_EMAIL=.*|ACME_EMAIL=ps8c@example.invalid|" \
            -e "s|^ROSTA_STATE_DIR=.*|ROSTA_STATE_DIR=${STATE_DIR}|" \
            -e "s|^ROSTA_BACKUP_DIR=.*|ROSTA_BACKUP_DIR=${STATE_DIR}/backups|" \
            "$ENV_DIR/frontend.env"

          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=${app_key}|" \
            -e 's|^DB_PASSWORD=.*|DB_PASSWORD=ps8c_db_password|' \
            -e 's|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=ps8c_root_password|' \
            -e 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ps8c_redis_password|' \
            -e 's|^ROSTA_CARRIER_WEBHOOK_SECRET=.*|ROSTA_CARRIER_WEBHOOK_SECRET=ps8c_carrier_secret|' \
            "$ENV_DIR/backend.env"

          chmod 600 "$ENV_DIR/frontend.env" "$ENV_DIR/backend.env"
          cat > "$ENV_DIR/runtime.sh" <<EOF
          export ROSTA_FRONTEND_ENV_FILE='$ENV_DIR/frontend.env'
          export ROSTA_BACKEND_ENV_FILE='$ENV_DIR/backend.env'
          export ROSTA_STATE_DIR='$STATE_DIR'
          export ROSTA_BACKUP_DIR='$STATE_DIR/backups'
          EOF
          chmod 600 "$ENV_DIR/runtime.sh"

          grep -q '^ROSTA_PAYMENT_ENABLED=false$' "$ENV_DIR/backend.env"
          grep -q '^ROSTA_REFUND_ENABLED=false$' "$ENV_DIR/backend.env"
          grep -q '^ROSTA_OTP_ENABLED=false$' "$ENV_DIR/backend.env"
          grep -q '^ROSTA_MEDIA_UPLOADS_ENABLED=false$' "$ENV_DIR/backend.env"

      - name: Run static production topology and package contracts
        shell: bash
        run: |
          set -o pipefail
          PS8C_AUDIT_OUTPUT="$EVIDENCE_DIR/topology-audit.json" \
            bash deploy/production/infrastructure-audit.sh \
            2>&1 | tee "$EVIDENCE_DIR/infrastructure-audit.log"
          grep -q 'ROSTA_PS8C_INFRASTRUCTURE_TOPOLOGY_CLEAN' "$EVIDENCE_DIR/infrastructure-audit.log"
          bash deploy/production/contract-test.sh \
            2>&1 | tee "$EVIDENCE_DIR/production-contract.log"

      - name: Rehearse production edge in isolation
        shell: bash
        env:
          ROSTA_ALLOW_REHEARSAL: "true"
        run: |
          set -o pipefail
          bash deploy/production/rehearsal.sh \
            2>&1 | tee "$EVIDENCE_DIR/edge-rehearsal.log"
          grep -q 'production edge rehearsal passed' "$EVIDENCE_DIR/edge-rehearsal.log"

      - name: Build exact production application images
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment
          rosta_compose build --pull api api-web frontend \
            2>&1 | tee "$EVIDENCE_DIR/production-build.log"
          for image in \
            "rosta-api:$CANDIDATE_SHA" \
            "rosta-api-web:$CANDIDATE_SHA" \
            "rosta-frontend:$CANDIDATE_SHA"; do
            docker image inspect "$image" >/dev/null
          done
          test "$(docker image inspect "rosta-api:$CANDIDATE_SHA" --format '{{.Config.User}}')" = 'www-data'
          test "$(docker image inspect "rosta-frontend:$CANDIDATE_SHA" --format '{{.Config.User}}')" = 'node'
          {
            docker image inspect "rosta-api:$CANDIDATE_SHA" --format 'api_id={{.Id}} user={{.Config.User}}'
            docker image inspect "rosta-api-web:$CANDIDATE_SHA" --format 'api_web_id={{.Id}} user={{.Config.User}}'
            docker image inspect "rosta-frontend:$CANDIDATE_SHA" --format 'frontend_id={{.Id}} user={{.Config.User}}'
          } | tee "$EVIDENCE_DIR/image-identities.txt"

      - name: Start isolated production stateful dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment
          rosta_compose up -d --wait mysql redis
          test "$(docker network inspect "${COMPOSE_PROJECT_NAME}_backend" --format '{{.Internal}}')" = 'true'
          test -z "$(docker port "$(rosta_compose ps -q mysql)" 2>/dev/null || true)"
          test -z "$(docker port "$(rosta_compose ps -q redis)" 2>/dev/null || true)"
          rosta_compose ps | tee "$EVIDENCE_DIR/stateful-services.txt"

      - name: Exercise production image database and Redis contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment
          rosta_compose run --rm api php artisan migrate:fresh --force --no-interaction \
            2>&1 | tee "$EVIDENCE_DIR/mysql-migrations.log"
          rosta_compose run --rm api php artisan rosta:infrastructure-acceptance --json \
            2>&1 | tee "$EVIDENCE_DIR/laravel-infrastructure.json"
          grep -q 'ROSTA_R2C_INFRASTRUCTURE_COMPLETE' "$EVIDENCE_DIR/laravel-infrastructure.json"

      - name: Prove state volumes survive service restart
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment

          rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --user=root "$DB_DATABASE" \
            -e "CREATE TABLE ps8c_persistence_probe (id INT PRIMARY KEY, marker VARCHAR(32) NOT NULL); INSERT INTO ps8c_persistence_probe VALUES (1, 'mysql-persisted');"
          rosta_compose stop mysql
          rosta_compose up -d --wait mysql
          mysql_marker="$(rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --batch --skip-column-names --user=root "$DB_DATABASE" \
            -e 'SELECT marker FROM ps8c_persistence_probe WHERE id=1;')"
          test "$mysql_marker" = 'mysql-persisted'
          rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --user=root "$DB_DATABASE" -e 'DROP TABLE ps8c_persistence_probe;'

          rosta_compose exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning \
            SET rosta:ps8c:persistence redis-persisted >/dev/null
          rosta_compose stop redis
          rosta_compose up -d --wait redis
          redis_marker="$(rosta_compose exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning \
            GET rosta:ps8c:persistence | tr -d '\r')"
          test "$redis_marker" = 'redis-persisted'
          rosta_compose exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning \
            DEL rosta:ps8c:persistence >/dev/null

          echo 'mysql_persistence=pass' | tee "$EVIDENCE_DIR/persistence.txt"
          echo 'redis_aof_persistence=pass' | tee -a "$EVIDENCE_DIR/persistence.txt"

      - name: Prove backup checksum and disposable restore
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment

          backup_file="$(bash deploy/production/backup.sh ps8c-ci | tail -n 1)"
          test -s "$backup_file"
          test -s "$backup_file.sha256"
          sha256sum -c "$backup_file.sha256"
          gzip -t "$backup_file"

          restore_db='rosta_ps8c_restore_probe'
          rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --user=root \
            -e "DROP DATABASE IF EXISTS \`$restore_db\`; CREATE DATABASE \`$restore_db\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          gzip -dc "$backup_file" | rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --user=root "$restore_db"
          migration_count="$(rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --batch --skip-column-names --user=root "$restore_db" \
            -e 'SELECT COUNT(*) FROM migrations;')"
          test "$migration_count" -gt 0
          rosta_compose exec -T -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql \
            mysql --user=root -e "DROP DATABASE \`$restore_db\`;"

          echo "backup_checksum=pass" | tee "$EVIDENCE_DIR/backup-restore.txt"
          echo "disposable_restore=pass" | tee -a "$EVIDENCE_DIR/backup-restore.txt"
          echo "restored_migration_rows=$migration_count" | tee -a "$EVIDENCE_DIR/backup-restore.txt"
          rm -f "$backup_file" "$backup_file.sha256"

      - name: Prove fail closed production activation example
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment
          set +e
          rosta_compose run --rm api php artisan rosta:readiness --strict --json \
            > "$EVIDENCE_DIR/production-readiness-fail-closed.json" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - "$EVIDENCE_DIR/production-readiness-fail-closed.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          if payload.get('ready') is not False:
              raise SystemExit('fail-closed production example unexpectedly reported ready=true')
          PY
          echo 'production_example_fail_closed=pass' | tee "$EVIDENCE_DIR/fail-closed.txt"

      - name: Start production application topology without public cutover
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$ENV_DIR/runtime.sh"
          source deploy/production/lib.sh
          load_production_environment
          rosta_compose up -d --wait api api-web worker scheduler frontend
          for service in api api-web worker scheduler frontend; do
            test -n "$(rosta_compose ps -q "$service")"
            rosta_compose ps --status running "$service" | grep -q "$service"
          done
          for service in api api-web frontend; do
            container_id="$(rosta_compose ps -q "$service")"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = 'healthy'
          done
          rosta_compose exec -T worker sh -c 'tr "\000" " " </proc/1/cmdline' \
            | grep -q 'queue:work'
          rosta_compose exec -T scheduler sh -c 'tr "\000" " " </proc/1/cmdline' \
            | grep -q 'schedule:work'
          rosta_compose ps | tee "$EVIDENCE_DIR/application-services.txt"
          echo 'public_edge_cutover_attempted=false' | tee "$EVIDENCE_DIR/runtime-boundary.txt"

      - name: Tear down disposable infrastructure
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$ENV_DIR/runtime.sh" ]; then
            source "$ENV_DIR/runtime.sh"
            source deploy/production/lib.sh
            load_production_environment
            rosta_compose down --volumes --remove-orphans
          fi
          rm -rf "$ENV_DIR" "$STATE_DIR"

      - name: Seal secret-safe PS8C evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum \
            Dockerfile.production \
            backend/Dockerfile.production \
            backend/composer.lock \
            package.json \
            bun.lock \
            deploy/production/docker-compose.yml \
            deploy/production/Caddyfile \
            | tee "$EVIDENCE_DIR/inputs-after.sha256"
          cmp "$EVIDENCE_DIR/inputs-before.sha256" "$EVIDENCE_DIR/inputs-after.sha256"
          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|REDIS_PASSWORD=|ROSTA_CARRIER_WEBHOOK_SECRET=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=|S3_SECRET_ACCESS_KEY=' "$EVIDENCE_DIR"; then
            echo 'Sensitive material entered PS8C evidence.' >&2
            exit 1
          fi
          if find "$EVIDENCE_DIR" -type f \( -name '*.env' -o -name '*.sql' -o -name '*.sql.gz' -o -name '*.zip' \) | grep -q .; then
            echo 'Environment, database or archive payload entered PS8C evidence.' >&2
            exit 1
          fi
          git diff --check
          git status --short --untracked-files=all | tee "$EVIDENCE_DIR/git-status-final.txt"
          test -z "$(git status --porcelain --untracked-files=all)"
          {
            echo 'ROSTA_PS8C_INFRASTRUCTURE_ACCEPTANCE_COMPLETE'
            echo "candidate=$(git rev-parse HEAD)"
            echo 'production_runtime_claimed=false'
            echo 'public_dns_tls_claimed=false'
            echo 'real_provider_connectivity_claimed=false'
            echo 'external_image_digest_pinning_claimed=false'
          } | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload PS8C infrastructure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-ps8c-infrastructure-${{ github.run_id }}
          path: /tmp/rosta-ps8c-evidence/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
