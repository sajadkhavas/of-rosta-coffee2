name: Browser Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install browser audit tools
        run: npm install --no-save --no-package-lock playwright@1.55.0 axe-core@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production worker
        env:
          VITE_SITE_URL: http://127.0.0.1:4173
          VITE_API_URL: http://127.0.0.1:8000/api/v1
          VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:4173,127.0.0.1:8000
          VITE_ALLOW_INDEXING: "false"
        run: bun run build
      - name: Start Cloudflare production worker
        shell: bash
        env:
          CI: "1"
        run: |
          test -f .output/server/wrangler.json
          setsid bun run preview -- --ip 127.0.0.1 --port 4173 > browser-audit-server.log 2>&1 &
          echo $! > browser-audit-server.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat browser-audit-server.pid)" 2>/dev/null; then
              cat browser-audit-server.log
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat browser-audit-server.log
          exit 1
      - name: Run responsive, accessibility and PWA audit
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
          AUDIT_OUTPUT_DIR: browser-audit
        run: node scripts/browser-audit.mjs
      - name: Run Phase 6 adversarial payment acceptance
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
          AUDIT_OUTPUT_DIR: browser-audit
        run: node scripts/phase6-browser-security.mjs
      - name: Upload browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            browser-audit
            browser-audit-server.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop Cloudflare production worker
        if: always()
        shell: bash
        run: |
          if [ -f browser-audit-server.pid ]; then
            worker_pid="$(cat browser-audit-server.pid)"
            kill -- -"$worker_pid" 2>/dev/null || kill "$worker_pid" 2>/dev/null || true
          fi
