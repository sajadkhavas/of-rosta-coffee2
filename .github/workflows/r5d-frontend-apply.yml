name: R5D Frontend Apply

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'program/r5d-product-packaging'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R5D branch
        uses: actions/checkout@v4
        with:
          ref: program/r5d-product-packaging

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Apply frontend integration
        run: |
          set -o pipefail
          python3 .github/r5d_apply_frontend.py 2>&1 | tee r5d-frontend-apply.log

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Format focused source files
        run: |
          bunx prettier --write \
            src/lib/api/contracts.ts \
            src/lib/api/schemas.ts \
            src/lib/api/financial-contracts.ts \
            src/lib/api/catalog.ts \
            src/lib/api/checkout.ts \
            src/lib/api/orders.ts \
            src/lib/api/seller-operations.ts \
            src/lib/cart-storage.ts \
            src/lib/cart-context.tsx \
            'src/routes/products.$slug.tsx' \
            src/routes/cart.tsx \
            src/routes/checkout.tsx \
            src/components/seller/SellerOperationsDashboard.tsx \
            scripts/audit-r5d-product-packaging.mjs \
            tests/unit/r5d-packaging.test.ts \
            package.json

      - name: Validate focused frontend scope
        run: |
          set -o pipefail
          {
            bun run audit:r5d
            bun test tests/unit/r5d-packaging.test.ts
            bun run typecheck
            bun run lint
            bun run build
          } 2>&1 | tee r5d-frontend-validation.log

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5d-frontend-validation-${{ github.run_id }}
          path: |
            r5d-frontend-apply.log
            r5d-frontend-validation.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit frontend source allowlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/api/contracts.ts \
            src/lib/api/schemas.ts \
            src/lib/api/financial-contracts.ts \
            src/lib/api/catalog.ts \
            src/lib/api/checkout.ts \
            src/lib/api/orders.ts \
            src/lib/api/seller-operations.ts \
            src/lib/cart-storage.ts \
            src/lib/cart-context.tsx \
            'src/routes/products.$slug.tsx' \
            src/routes/cart.tsx \
            src/routes/checkout.tsx \
            src/components/seller/SellerOperationsDashboard.tsx \
            scripts/audit-r5d-product-packaging.mjs \
            tests/unit/r5d-packaging.test.ts \
            package.json
          git commit -m "R5D expose packaging across marketplace surfaces"
          git push origin HEAD:program/r5d-product-packaging
