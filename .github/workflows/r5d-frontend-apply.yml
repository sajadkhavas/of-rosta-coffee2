name: R5D Frontend Apply

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'program/r5d-product-packaging'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R5D branch
        uses: actions/checkout@v4
        with:
          ref: program/r5d-product-packaging

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Harden temporary patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/r5d_apply_frontend.py')
          text = path.read_text()
          old_anchor = '''    "             {product.origin.name} · {productStatusLabel(product.status)}",
              "             {product.origin.name} · {productStatusLabel(product.status)} · {product.packaging.isFree ? \"بسته‌بندی رایگان\" : `بسته‌بندی ${formatIrr(product.packaging.feeAmount)}`}",'''
          new_anchor = '''    "{product.origin.name} · {productStatusLabel(product.status)}",
              "{product.origin.name} · {productStatusLabel(product.status)} · {product.packaging.isFree ? \"بسته‌بندی رایگان\" : `بسته‌بندی ${formatIrr(product.packaging.feeAmount)}`}",'''
          if old_anchor in text:
              text = text.replace(old_anchor, new_anchor, 1)
          text = text.replace(
              '!files.schemas.includes(".max(1)")',
              '!files.schemas.includes("groups: z.array(quoteGroupWireSchema).min(1).max(1)") &&\n    !files.schemas.includes("sub_orders: z.array(subOrderWireSchema).min(1).max(1)")',
              1,
          )
          path.write_text(text)
          PY

      - name: Apply frontend integration
        run: |
          set -o pipefail
          python3 .github/r5d_apply_frontend.py 2>&1 | tee r5d-frontend-apply.log

      - name: Upload frontend apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5d-frontend-apply-${{ github.run_id }}
          path: r5d-frontend-apply.log
          if-no-files-found: error
          retention-days: 2

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Format focused source files
        run: |
          bunx prettier --write \
            src/lib/api/contracts.ts \
            src/lib/api/schemas.ts \
            src/lib/api/financial-contracts.ts \
            src/lib/api/catalog.ts \
            src/lib/api/checkout.ts \
            src/lib/api/orders.ts \
            src/lib/api/seller-operations.ts \
            src/lib/cart-storage.ts \
            src/lib/cart-context.tsx \
            'src/routes/products.$slug.tsx' \
            src/routes/cart.tsx \
            src/routes/checkout.tsx \
            src/components/seller/SellerOperationsDashboard.tsx \
            scripts/audit-r5d-product-packaging.mjs \
            tests/unit/r5d-packaging.test.ts \
            package.json

      - name: Run focused validation
        run: |
          set -o pipefail
          {
            bun run audit:r5d
            bun test tests/unit/r5d-packaging.test.ts
            bun run typecheck
            bun run lint
            bun run build
          } 2>&1 | tee r5d-frontend-validation.log

      - name: Upload frontend validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5d-frontend-validation-${{ github.run_id }}
          path: r5d-frontend-validation.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit frontend source allowlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/api/contracts.ts \
            src/lib/api/schemas.ts \
            src/lib/api/financial-contracts.ts \
            src/lib/api/catalog.ts \
            src/lib/api/checkout.ts \
            src/lib/api/orders.ts \
            src/lib/api/seller-operations.ts \
            src/lib/cart-storage.ts \
            src/lib/cart-context.tsx \
            'src/routes/products.$slug.tsx' \
            src/routes/cart.tsx \
            src/routes/checkout.tsx \
            src/components/seller/SellerOperationsDashboard.tsx \
            scripts/audit-r5d-product-packaging.mjs \
            tests/unit/r5d-packaging.test.ts \
            package.json
          git commit -m "R5D expose packaging across marketplace surfaces"
          git push origin HEAD:program/r5d-product-packaging
