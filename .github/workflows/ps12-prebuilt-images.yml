name: PS12 Prebuilt Server Images

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact frozen PS12 commit
        required: true
        default: 4a54780d504b91527a86777e7f04368022354686
      staging_site_domain:
        description: Staging frontend hostname, e.g. staging.rosta.shop
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: rosta-ps12-prebuilt-images
  cancel-in-progress: false

jobs:
  build-publish:
    name: build-publish-immutable-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_RELEASE_SHA: 4a54780d504b91527a86777e7f04368022354686
      EXPECTED_RELEASE_TAG: rosta-pre-server-2026-09-05
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/sajadkhavas
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          release_sha="${{ inputs.release_sha }}"
          site_domain="${{ inputs.staging_site_domain }}"

          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$release_sha" = "$EXPECTED_RELEASE_SHA"

          [[ "$site_domain" =~ ^[a-z0-9][a-z0-9.-]*[a-z0-9]$ ]]
          [[ "$site_domain" == *.rosta.shop ]]
          test "$site_domain" != "rosta.shop"
          [[ "$site_domain" != api.* ]]
          [[ "$site_domain" != media.* ]]

          api_domain="api.$site_domain"
          media_domain="media.$site_domain"
          site_url="https://$site_domain"
          api_url="https://$api_domain/api/v1"
          payment_redirect_hosts="$site_domain"

          config_id="$(
            printf '%s\n'               "site=$site_url"               "api=$api_url"               "media=https://$media_domain"               "payment_redirect_hosts=$payment_redirect_hosts"               "indexing=false"               | sha256sum | awk '{print substr($1,1,12)}'
          )"

          {
            echo "RELEASE_SHA=$release_sha"
            echo "STAGING_SITE_DOMAIN=$site_domain"
            echo "STAGING_API_DOMAIN=$api_domain"
            echo "STAGING_MEDIA_DOMAIN=$media_domain"
            echo "VITE_SITE_URL=$site_url"
            echo "VITE_API_URL=$api_url"
            echo "VITE_PAYMENT_REDIRECT_HOSTS=$payment_redirect_hosts"
            echo "CONFIG_ID=$config_id"
            echo "API_IMAGE=$IMAGE_NAMESPACE/rosta-api:$release_sha"
            echo "API_WEB_IMAGE=$IMAGE_NAMESPACE/rosta-api-web:$release_sha"
            echo "FRONTEND_IMAGE=$IMAGE_NAMESPACE/rosta-frontend:$release_sha-$config_id"
          } >> "$GITHUB_ENV"

      - name: Checkout exact frozen source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          clean: true

      - name: Verify frozen tag identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "$EXPECTED_RELEASE_TAG")" = "$EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Log in to GHCR
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}"             | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build immutable backend application image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build             --pull             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.revision=$RELEASE_SHA"             --label "org.opencontainers.image.version=$RELEASE_SHA"             --target app             --file backend/Dockerfile.production             --tag "$API_IMAGE"             backend
          docker run --rm --entrypoint php "$API_IMAGE" -v

      - name: Build immutable backend web image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build             --pull             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.revision=$RELEASE_SHA"             --label "org.opencontainers.image.version=$RELEASE_SHA"             --target web             --file backend/Dockerfile.production             --tag "$API_WEB_IMAGE"             backend
          docker run --rm --entrypoint nginx "$API_WEB_IMAGE" -t

      - name: Build immutable frontend SSR image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build             --pull             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"             --label "org.opencontainers.image.revision=$RELEASE_SHA"             --label "org.opencontainers.image.version=$RELEASE_SHA-$CONFIG_ID"             --build-arg "VITE_SITE_URL=$VITE_SITE_URL"             --build-arg "VITE_API_URL=$VITE_API_URL"             --build-arg "VITE_PAYMENT_REDIRECT_HOSTS=$VITE_PAYMENT_REDIRECT_HOSTS"             --build-arg "VITE_ALLOW_INDEXING=false"             --build-arg "VITE_PERFORMANCE_ENDPOINT="             --file Dockerfile.staging             --tag "$FRONTEND_IMAGE"             .

      - name: Push immutable images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker push "$API_IMAGE"
          docker push "$API_WEB_IMAGE"
          docker push "$FRONTEND_IMAGE"

      - name: Create release manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p server-image-manifest

          api_digest="$(docker image inspect "$API_IMAGE" --format '{{index .RepoDigests 0}}')"
          web_digest="$(docker image inspect "$API_WEB_IMAGE" --format '{{index .RepoDigests 0}}')"
          frontend_digest="$(docker image inspect "$FRONTEND_IMAGE" --format '{{index .RepoDigests 0}}')"

          cat > server-image-manifest/manifest.env <<EOF
          ROSTA_RELEASE_SHA=$RELEASE_SHA
          ROSTA_RELEASE_TAG=$EXPECTED_RELEASE_TAG
          ROSTA_CONFIG_ID=$CONFIG_ID
          STAGING_SITE_DOMAIN=$STAGING_SITE_DOMAIN
          STAGING_API_DOMAIN=$STAGING_API_DOMAIN
          STAGING_MEDIA_DOMAIN=$STAGING_MEDIA_DOMAIN
          ROSTA_API_REMOTE_IMAGE=$API_IMAGE
          ROSTA_API_WEB_REMOTE_IMAGE=$API_WEB_IMAGE
          ROSTA_FRONTEND_REMOTE_IMAGE=$FRONTEND_IMAGE
          ROSTA_API_DIGEST=$api_digest
          ROSTA_API_WEB_DIGEST=$web_digest
          ROSTA_FRONTEND_DIGEST=$frontend_digest
          EOF

          sha256sum server-image-manifest/manifest.env             > server-image-manifest/manifest.env.sha256

          cat server-image-manifest/manifest.env >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: rosta-ps12-server-images-${{ github.run_id }}
          path: server-image-manifest
          if-no-files-found: error
          retention-days: 30
