name: Fix Rosta browser audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-rosta-browser-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-phases-1-4
          fetch-depth: 0
      - name: Apply verified browser audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              file = Path(path)
              text = file.read_text()
              occurrences = text.count(old)
              if occurrences == 0:
                  raise SystemExit(f"Expected pattern not found in {path}: {old[:100]!r}")
              if count != -1 and occurrences < count:
                  raise SystemExit(f"Expected {count} occurrences in {path}, found {occurrences}")
              file.write_text(text.replace(old, new, count))
              print(f"patched {path}: {occurrences} match(es)")

          # TanStack head() can be called before validated search is available during hydration.
          replace(
              "src/routes/products.index.tsx",
              '  head: ({ search }) => {\n    const title = search.origin',
              '  head: ({ search }) => {\n    const resolvedSearch = searchSchema.parse(search ?? {});\n    const title = resolvedSearch.origin',
              1,
          )
          replace(
              "src/routes/products.index.tsx",
              '? `خرید قهوه ${search.origin} | رستا`',
              '? `خرید قهوه ${resolvedSearch.origin} | رستا`',
              1,
          )
          replace(
              "src/routes/products.index.tsx",
              ': search.roast\n        ? `خرید قهوه رست ${search.roast} | رستا`',
              ': resolvedSearch.roast\n        ? `خرید قهوه رست ${resolvedSearch.roast} | رستا`',
              1,
          )
          replace(
              "src/routes/products.index.tsx",
              'links: [{ rel: "canonical", href: canonicalFor(search) }]',
              'links: [{ rel: "canonical", href: canonicalFor(resolvedSearch) }]',
              1,
          )

          # Contrast fixes identified by Axe.
          replace(
              "src/components/Footer.tsx",
              'text-[color:var(--muted-gold)]',
              'text-[color:var(--light)]',
          )
          replace(
              "src/components/RoasteryCard.tsx",
              'text-[color:var(--muted-gold)]',
              'text-[color:var(--light)]',
          )
          replace(
              "src/routes/blog.index.tsx",
              'text-[color:var(--muted-gold)]',
              'text-[color:var(--light)]',
          )
          replace(
              "src/routes/quiz.tsx",
              'text-[color:var(--muted-gold)]',
              'text-[color:var(--light)]',
          )

          # Preserve the small visual dots while making the actual target at least 24px.
          replace(
              "src/routes/quiz.tsx",
              '''            <button
              key={i}
              type="button"
              onClick={() => scrollTo(i)}
              aria-label={`سؤال ${toFa(i + 1)}`}
              className="h-1.5 rounded-full transition-all"
              style={{
                width: i === currentStep ? 24 : 8,
                background: i <= currentStep ? "var(--roast)" : "rgba(232,213,183,0.25)",
              }}
            />''',
              '''            <button
              key={i}
              type="button"
              onClick={() => scrollTo(i)}
              aria-label={`سؤال ${toFa(i + 1)}`}
              className="grid h-6 min-w-6 place-items-center rounded-full"
            >
              <span
                aria-hidden
                className="block h-1.5 rounded-full transition-all"
                style={{
                  width: i === currentStep ? 18 : 8,
                  background: i <= currentStep ? "var(--roast)" : "rgba(232,213,183,0.45)",
                }}
              />
            </button>''',
              1,
          )

          # Search clear action needs a real touch target.
          replace(
              "src/routes/search.tsx",
              'className="absolute left-3 top-1/2 -translate-y-1/2 text-[color:var(--light)]"',
              'className="absolute left-2 top-1/2 grid size-8 -translate-y-1/2 place-items-center rounded-lg text-[color:var(--light)] hover:bg-white/5"',
              1,
          )

          # Reduced-motion users must not receive a custom cursor or WebGL canvas.
          replace(
              "src/lib/animations.ts",
              'export function initCursor() {\n  if (window.matchMedia("(hover: none)").matches) return;',
              'export function initCursor() {\n  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;\n  if (window.matchMedia("(hover: none)").matches) return;',
              1,
          )
          replace(
              "src/components/HeroBean.tsx",
              '    const mount = mountRef.current;\n    if (!mount) return;\n    const w = mount.clientWidth || 400;',
              '    const mount = mountRef.current;\n    if (!mount) return;\n    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;\n    const w = mount.clientWidth || 400;',
              1,
          )

          styles = Path("src/styles.css")
          css = styles.read_text()
          reduced = '''\n@media (prefers-reduced-motion: reduce) {\n  .bean-3d,\n  .particle {\n    animation: none !important;\n  }\n}\n'''
          if reduced.strip() not in css:
              styles.write_text(css + reduced)
              print("patched src/styles.css: reduced-motion fallback")
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "fix: resolve browser accessibility and hydration audit"
          git push origin HEAD:agent/migrate-phases-1-4
