name: Temporary R5G PHPStan Fix

on:
  push:
    branches:
      - program/r5g-rosta-hub-grinding-routing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact static-analysis repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/app/Services/Checkout/RoasteryGrindingSelection.php')
          text = path.read_text()
          old = """            if ($zoneRequired) {
                if (! $address instanceof Address) {
                    throw new ApiDomainException(
                        'hub_zone_ineligible',
                        'آدرس معتبر برای مسیر هاب وجود ندارد.',
                        409,
                    );
                }
                $confirmedAddress = $address;
"""
          new = """            if ($zoneRequired) {
                $confirmedAddress = $address;
"""
          if old not in text:
              raise SystemExit('address anchor not found')
          text = text.replace(old, new, 1)
          old = """        $inboundFee = $selectedZone?->inbound_shipping_fee ?? 0;
        $outboundFee = $selectedZone?->outbound_shipping_fee ?? 0;
"""
          new = """        $inboundFee = $selectedZone instanceof RostaHubServiceZone
            ? $selectedZone->inbound_shipping_fee
            : 0;
        $outboundFee = $selectedZone instanceof RostaHubServiceZone
            ? $selectedZone->outbound_shipping_fee
            : 0;
"""
          if old not in text:
              raise SystemExit('fee anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format, verify and commit
        run: |
          composer install --working-dir=backend --no-interaction --no-progress --prefer-dist
          (cd backend && vendor/bin/pint app/Services/Checkout/RoasteryGrindingSelection.php)
          (cd backend && vendor/bin/phpstan analyse app/Services/Checkout/RoasteryGrindingSelection.php --memory-limit=1G)
          rm -f .github/workflows/r5g-phpstan-fix.yml scripts/.r5g-phpstan-fix-trigger
          git config user.name "Rosta R5G Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R5G resolve Hub selection static-analysis invariants"
          git push origin HEAD:program/r5g-rosta-hub-grinding-routing
