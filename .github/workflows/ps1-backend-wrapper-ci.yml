name: PS1 Backend Wrapper CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - ".github/workflows/ps1-backend-wrapper-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_sqlite, posix, redis, simplexml, sockets, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install locked backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run exact package backend gate
        run: bun run check:backend
