name: Rosta R1D Repair and Complete Gate

on:
  pull_request:
    branches:
      - integration/rosta-r-program
    paths:
      - .github/workflows/r1d-repair-and-gate.yml
      - .github/scripts/r1d-repair.py
      - .github/fixtures/audit-seo-content.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosta-r1d-repair-gate
  cancel-in-progress: false

jobs:
  repair-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_BRANCH: program/r1d-frontend-gate
      EXPECTED_HEAD: 39a5b2683ee4db943d0352c355e01b219bf47bf2
      EVIDENCE_DIR: /tmp/rosta-r1d-evidence
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      VITE_SITE_URL: https://rosta.shop
      VITE_API_URL: http://127.0.0.1:8000/api/v1
      VITE_PAYMENT_REDIRECT_HOSTS: 127.0.0.1:8000
      VITE_ALLOW_INDEXING: "false"
      NITRO_PRESET: node-server
    steps:
      - name: Checkout R1D branch
        uses: actions/checkout@v4
        with:
          ref: program/r1d-frontend-gate
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun 1.2.22
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Verify starting snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR/logs"
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            git status --short --branch
          } | tee "$EVIDENCE_DIR/snapshot.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "22"
          test "$(bun --version)" = "1.2.22"
          test -z "$(git status --porcelain)"
          sha256sum package.json bun.lock src/routeTree.gen.ts | tee "$EVIDENCE_DIR/hashes-start.txt"

      - name: Diagnose clean-install route drift
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/logs/baseline-frozen-install.log"
          sha256sum src/routeTree.gen.ts | tee "$EVIDENCE_DIR/route-hash-after-baseline-install.txt"
          git diff -- src/routeTree.gen.ts > "$EVIDENCE_DIR/route-diff-after-baseline-install.patch" || true
          bun run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/baseline-typecheck.log"

      - name: Apply reviewed R1D repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          git show origin/automation/r1d-executor:.github/scripts/r1d-repair.py > /tmp/r1d-repair.py
          python /tmp/r1d-repair.py
          git show origin/automation/r1d-executor:.github/fixtures/audit-seo-content.mjs > scripts/audit-seo-content.mjs
          test -s scripts/audit-seo-content.mjs
          git diff --check

      - name: Generate and review lock proposal
        shell: bash
        run: |
          set -Eeuo pipefail
          proposal=/tmp/rosta-r1d-lock-proposal
          rm -rf "$proposal"
          mkdir -p "$proposal"
          cp package.json bun.lock "$proposal/"
          [ ! -f bunfig.toml ] || cp bunfig.toml "$proposal/"
          pushd "$proposal" >/dev/null
          /usr/bin/time -f 'elapsed=%e' bun install --lockfile-only 2>&1 | tee "$EVIDENCE_DIR/logs/lock-proposal.log"
          rm -rf node_modules
          bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/logs/proposal-frozen-install.log"
          node --input-type=module <<'NODE' | tee "$EVIDENCE_DIR/dependency-proof.json"
          import fs from 'node:fs';
          const read = (name) => JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
          const proof = {
            'tw-animate-css': read('tw-animate-css').version,
            'eslint-config-prettier': read('eslint-config-prettier').version,
          };
          console.log(JSON.stringify(proof, null, 2));
          if (proof['tw-animate-css'] !== '1.3.4') process.exit(20);
          if (proof['eslint-config-prettier'] !== '10.1.1') process.exit(21);
          NODE
          popd >/dev/null
          cmp package.json "$proposal/package.json"
          cp "$proposal/bun.lock" bun.lock
          git diff --check

      - name: Prove frozen dependencies and deterministic routes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf node_modules
          /usr/bin/time -f 'elapsed=%e' bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/logs/frozen-run-1.log"
          sha256sum package.json bun.lock | tee "$EVIDENCE_DIR/hashes-frozen-run-1.txt"

          bun run routes:generate 2>&1 | tee "$EVIDENCE_DIR/logs/routes-run-1.log"
          sha256sum src/routeTree.gen.ts | tee "$EVIDENCE_DIR/route-hash-run-1.txt"
          cp src/routeTree.gen.ts "$EVIDENCE_DIR/routeTree-run-1.ts"
          bun run routes:generate 2>&1 | tee "$EVIDENCE_DIR/logs/routes-run-2.log"
          sha256sum src/routeTree.gen.ts | tee "$EVIDENCE_DIR/route-hash-run-2.txt"
          cmp "$EVIDENCE_DIR/route-hash-run-1.txt" "$EVIDENCE_DIR/route-hash-run-2.txt"
          cmp "$EVIDENCE_DIR/routeTree-run-1.ts" src/routeTree.gen.ts

          rm -rf node_modules
          /usr/bin/time -f 'elapsed=%e' bun install --frozen-lockfile 2>&1 | tee "$EVIDENCE_DIR/logs/frozen-run-2.log"
          sha256sum package.json bun.lock | tee "$EVIDENCE_DIR/hashes-frozen-run-2.txt"
          cmp "$EVIDENCE_DIR/hashes-frozen-run-1.txt" "$EVIDENCE_DIR/hashes-frozen-run-2.txt"
          bun run routes:generate 2>&1 | tee "$EVIDENCE_DIR/logs/routes-after-second-install.log"
          cmp "$EVIDENCE_DIR/routeTree-run-1.ts" src/routeTree.gen.ts

      - name: Run every frontend gate independently
        shell: bash
        run: |
          set -Eeuo pipefail
          run_gate() {
            name="$1"; shift
            start=$(date +%s)
            "$@" >"$EVIDENCE_DIR/logs/$name.log" 2>&1
            status=$?
            end=$(date +%s)
            printf '%s\t%s\t%s\n' "$name" "$status" "$((end-start))" | tee -a "$EVIDENCE_DIR/matrix.tsv"
            return "$status"
          }

          run_gate audit-phase6 bun run audit:phase6
          run_gate audit-seo bun run audit:seo
          run_gate audit-phase16 bun run audit:phase16
          run_gate audit-phase17 bun run audit:phase17
          run_gate audit-admin-finance bun run audit:admin-finance
          run_gate audit-seller-operations bun run audit:seller-operations
          run_gate audit-admin-operations bun run audit:admin-operations
          run_gate audit-phase20 bun run audit:phase20
          run_gate audit-phase21 bun run audit:phase21
          run_gate audit-phase22 bun run audit:phase22
          run_gate unit-tests bun run test:unit
          run_gate typecheck bun run typecheck
          run_gate lint bun run lint
          run_gate build bun run build
          test -s .output/server/index.mjs
          test -d .output/public
          find .output/public -type f | grep -q .
          run_gate bundle-check bun run bundle:check

      - name: Run final aggregate gate once
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .output
          /usr/bin/time -f 'elapsed=%e' bun run check 2>&1 | tee "$EVIDENCE_DIR/logs/final-check.log"
          test -s .output/server/index.mjs
          test -d .output/public
          find .output/public -type f | grep -q .
          bun run routes:generate 2>&1 | tee "$EVIDENCE_DIR/logs/routes-after-final-check.log"
          cmp "$EVIDENCE_DIR/routeTree-run-1.ts" src/routeTree.gen.ts

      - name: Enforce scope and push R1D
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed" | tee "$EVIDENCE_DIR/changed-files.txt"
          allowed=$'bun.lock\npackage.json\nscripts/audit-phase17-release-baseline.mjs\nscripts/audit-phase6-security.mjs\nscripts/audit-seo-content.mjs\nsrc/routeTree.gen.ts\nvite.config.ts'
          test "$changed" = "$allowed"
          test -z "$(git diff --name-only -- backend deploy .github public tests 2>/dev/null || true)"
          test -z "$(git status --porcelain | grep -vE '^( M|M |A | D|D |\?\?) (bun.lock|package.json|scripts/audit-phase17-release-baseline.mjs|scripts/audit-phase6-security.mjs|scripts/audit-seo-content.mjs|src/routeTree.gen.ts|vite.config.ts)$' || true)"
          git diff --stat | tee "$EVIDENCE_DIR/diff-stat.txt"
          git config user.name 'Rosta Program Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json bun.lock scripts/audit-phase6-security.mjs scripts/audit-phase17-release-baseline.mjs scripts/audit-seo-content.mjs src/routeTree.gen.ts vite.config.ts
          git commit -m 'fix(frontend): complete production quality gate'
          git push origin HEAD:"$TARGET_BRANCH"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/result-commit.txt"
          echo 'frontend_foundation=ready' | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload R1D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r1d-evidence-${{ github.run_id }}
          path: /tmp/rosta-r1d-evidence
          if-no-files-found: warn
          retention-days: 14
