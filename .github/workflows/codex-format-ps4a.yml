name: Codex PS4A backend formatter

on:
  push:
    branches:
      - phase/rosta-ps4a-financial-core

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Install locked depencies and format phase PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd backend
          composer install --no-interaction --prefer-dist
          cd ..
          baseline=2a6f583b4c2f707104b53bf67cdbcc7eff1276dc
          git diff --name-only -z "$baseline...HEAD" -- '*.php' \
            | xargs -0 -r backend/vendor/bin/pint
          git diff --binary > ps4a-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ps4a-formatter-patch
          path: ps4a-format.patch
          if-no-files-found: error
          retention-days: 1
