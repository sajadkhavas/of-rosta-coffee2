name: R5C Publish Snapshot

on:
  push:
    branches:
      - program/r5c-multi-roastery-checkout

permissions:
  contents: write

concurrency:
  group: r5c-publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout R5C branch
        uses: actions/checkout@v4
        with:
          ref: program/r5c-multi-roastery-checkout
          fetch-depth: 0

      - name: Reconstruct reviewed R5C snapshot
        shell: bash
        run: |
          cat .github/r5c-publish/chunk-*.txt > /tmp/r5c-snapshot.tar.xz.b64
          base64 --decode /tmp/r5c-snapshot.tar.xz.b64 > /tmp/r5c-snapshot.tar.xz
          echo '5f8e7bfe91293933b05a0c1174522902414969eadc0d37714b973e72a784cce8  /tmp/r5c-snapshot.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/r5c-snapshot.tar.xz -C .
          rm -rf .github/r5c-publish
          rm .github/workflows/r5c-publish-snapshot.yml

      - name: Verify PHP and Composer JSON
        shell: bash
        run: |
          find backend/app backend/config backend/scripts backend/tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r 'json_decode(file_get_contents("backend/composer.json"), true, 512, JSON_THROW_ON_ERROR);'

      - name: Commit implementation snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R5C — multi-roastery cart quote and order creation'
          git push origin HEAD:program/r5c-multi-roastery-checkout
