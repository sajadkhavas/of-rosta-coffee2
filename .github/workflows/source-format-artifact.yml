name: Source Format Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/source-format-artifact.yml"
      - "scripts/accept-r3b-runtime.mjs"
      - "scripts/audit-r3b-integrated-runtime.mjs"
      - "scripts/audit-r3c-browser-acceptance.mjs"
      - "scripts/audit-r3c2-commerce-roles.mjs"
      - "scripts/audit-r3d-final-integration.mjs"
      - "scripts/audit-seo-content.mjs"
      - "tests/browser/r3c-public-customer.spec.ts"
      - "tests/browser/r3c2-commerce-roles.spec.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: program/r3c2-commerce-roles
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Format reported sources with the locked Prettier version
        shell: bash
        run: |
          set -Eeuo pipefail
          bunx prettier --write \
            scripts/accept-r3b-runtime.mjs \
            scripts/audit-r3b-integrated-runtime.mjs \
            scripts/audit-r3c-browser-acceptance.mjs \
            scripts/audit-r3c2-commerce-roles.mjs \
            scripts/audit-r3d-final-integration.mjs \
            scripts/audit-seo-content.mjs \
            tests/browser/r3c-public-customer.spec.ts \
            tests/browser/r3c2-commerce-roles.spec.ts
          git diff --check
          git diff --binary > prettier-format.patch

          unexpected="$(
            git status --porcelain --untracked-files=all |
              grep -vE '^ M (scripts/accept-r3b-runtime\.mjs|scripts/audit-r3b-integrated-runtime\.mjs|scripts/audit-r3c-browser-acceptance\.mjs|scripts/audit-r3c2-commerce-roles\.mjs|scripts/audit-r3d-final-integration\.mjs|scripts/audit-seo-content\.mjs|tests/browser/r3c-public-customer\.spec\.ts|tests/browser/r3c2-commerce-roles\.spec\.ts)$' |
              grep -vE '^\?\? prettier-format\.patch$' || true
          )"
          test -z "$unexpected"

      - name: Commit bounded formatting result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f prettier-format.patch
          if git diff --quiet; then
            echo "Locked Prettier output is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/accept-r3b-runtime.mjs \
            scripts/audit-r3b-integrated-runtime.mjs \
            scripts/audit-r3c-browser-acceptance.mjs \
            scripts/audit-r3c2-commerce-roles.mjs \
            scripts/audit-r3d-final-integration.mjs \
            scripts/audit-seo-content.mjs \
            tests/browser/r3c-public-customer.spec.ts \
            tests/browser/r3c2-commerce-roles.spec.ts
          git commit -m "R3D format acceptance sources with locked Prettier"
          git push origin HEAD:program/r3c2-commerce-roles

      - name: Upload formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-locked-prettier-${{ github.run_id }}
          path: |
            scripts/accept-r3b-runtime.mjs
            scripts/audit-r3b-integrated-runtime.mjs
            scripts/audit-r3c-browser-acceptance.mjs
            scripts/audit-r3c2-commerce-roles.mjs
            scripts/audit-r3d-final-integration.mjs
            scripts/audit-seo-content.mjs
            tests/browser/r3c-public-customer.spec.ts
            tests/browser/r3c2-commerce-roles.spec.ts
          retention-days: 1
