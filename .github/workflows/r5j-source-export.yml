name: Temporary R5J Source Export

on:
  pull_request:
    branches:
      - integration/rosta-r5-marketplace
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'program/r5j-rosta-hub-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Export exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/r5j-head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/r5j-tree.txt
          tar --exclude=.git --exclude=node_modules --exclude=backend/vendor --exclude='*.audit.json' -czf /tmp/r5j-source.tar.gz .
          sha256sum /tmp/r5j-source.tar.gz > /tmp/r5j-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r5j-source-${{ github.sha }}
          path: |
            /tmp/r5j-source.tar.gz
            /tmp/r5j-source.sha256
            /tmp/r5j-head.txt
            /tmp/r5j-tree.txt
          if-no-files-found: error
          retention-days: 1
