name: PS10 Final Source Release

on:
  pull_request:
    branches: [integration/rosta-release-candidate]
  push:
    branches: [integration/rosta-release-candidate]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ps10-final-source-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ROSTA_PS9_TAG: rosta-pre-server-2026-09-01
  ROSTA_PS9_ACCEPTED_SHA: ab96dd2280f9e1870455cadc10297ee0fa20a308
  ROSTA_PS10_TAG: rosta-pre-server-2026-09-02
  ROSTA_PS10_ACCEPTED_SHA: 8dd13dda3a1e8a9b240112a659586f6eac52cdb3
  ROSTA_PS10_PRE_RELEASE_MERGE_SHA: fd55c99e80d8be3b130bde5ce172f5b3066a28bd
  ROSTA_PS10_ORIGINAL_SOURCE_HEAD: 9d466b787ac5b602d0417a6d124cbd438a12557d

jobs:
  validate-source:
    name: validate-source-lineage-and-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_head: ${{ steps.identity.outputs.source_head }}
      release_needed: ${{ steps.identity.outputs.release_needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_DIR: /tmp/rosta-ps10-validation/${{ github.run_id }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable source lineage
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s docs/pre-server/PS10_FINAL_ACCEPTANCE.md
          test -s docs/pre-server/PS10_RELEASE_NOTES.md
          test -s docs/pre-server/PS10_RELEASE_RECOVERY.md

          git fetch --force --tags origin
          test "$(git rev-parse "$ROSTA_PS9_TAG^{commit}")" = "$ROSTA_PS9_ACCEPTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS9_TAG" --jq .tag_name)" = "$ROSTA_PS9_TAG"

          if git rev-parse --verify "$ROSTA_PS10_TAG^{commit}" >/dev/null 2>&1; then
            existing_ps10="$(git rev-parse "$ROSTA_PS10_TAG^{commit}")"
            test "$existing_ps10" = "$ROSTA_PS10_ACCEPTED_SHA" || {
              echo "Frozen PS10 tag moved from accepted source identity: $existing_ps10" >&2
              exit 1
            }
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS10_TAG" --jq .tag_name)" = "$ROSTA_PS10_TAG"
            git merge-base --is-ancestor "$ROSTA_PS10_ACCEPTED_SHA" "$CANDIDATE_SHA"

            source_head="$ROSTA_PS10_ACCEPTED_SHA"
            echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            {
              echo "mode=frozen-verification"
              echo "event=${{ github.event_name }}"
              echo "candidate=$CANDIDATE_SHA"
              echo "source_head=$source_head"
              echo "candidate_tree=$(git rev-parse "$CANDIDATE_SHA^{tree}")"
              echo "ps9_tag=$ROSTA_PS9_TAG"
              echo "ps9_accepted_sha=$ROSTA_PS9_ACCEPTED_SHA"
              echo "ps10_tag=$ROSTA_PS10_TAG"
              echo "ps10_accepted_sha=$ROSTA_PS10_ACCEPTED_SHA"
            } | tee "$EVIDENCE_DIR/identity.txt"
            exit 0
          fi

          read -r -a pre_release_parents <<< "$(git rev-list --parents -n 1 "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA")"
          test "${#pre_release_parents[@]}" -eq 3
          test "${pre_release_parents[1]}" = "$ROSTA_PS9_ACCEPTED_SHA"
          test "${pre_release_parents[2]}" = "$ROSTA_PS10_ORIGINAL_SOURCE_HEAD"
          test "$(git rev-parse "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA^{tree}")" = "$(git rev-parse "$ROSTA_PS10_ORIGINAL_SOURCE_HEAD^{tree}")"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            read -r -a parents <<< "$(git rev-list --parents -n 1 "$CANDIDATE_SHA")"
            test "${#parents[@]}" -eq 3
            base_parent="${parents[1]}"
            source_head="${parents[2]}"
            test "$base_parent" = "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA"
            test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$(git rev-parse "$source_head^{tree}")"
            git diff --check "$base_parent...$source_head"

            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$source_head" \
              -f event=pull_request \
              -f per_page=100 \
              > "$EVIDENCE_DIR/source-head-workflow-runs.json"

            required=(
              "CI"
              "Backend CI"
              "Full-stack Integration CI"
              "Browser Acceptance CI"
              "R3 Final Gate"
              "R4 Staging Package CI"
              "Production Package CI"
              "PS8A Frontend Acceptance"
              "PS8B Backend Finance Acceptance"
              "PS8C Infrastructure Acceptance"
              "PS1 Backend Wrapper CI"
              "PS9 Final Pre-server Freeze"
              "PS10 Final Source Release"
            )

            : > "$EVIDENCE_DIR/required-workflow-matrix.txt"
            for workflow in "${required[@]}"; do
              success_count="$(
                jq --arg workflow "$workflow" --arg source_head "$source_head" \
                  '[.workflow_runs[] | select(.name == $workflow and .head_sha == $source_head and .status == "completed" and .conclusion == "success")] | length' \
                  "$EVIDENCE_DIR/source-head-workflow-runs.json"
              )"
              test "$success_count" -ge 1 || {
                echo "Missing successful exact-head workflow: $workflow" >&2
                exit 1
              }
              echo "$workflow=PASS" >> "$EVIDENCE_DIR/required-workflow-matrix.txt"
            done
          else
            source_head="$CANDIDATE_SHA"
            git merge-base --is-ancestor "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA" "$source_head"
            git diff --check "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA...$source_head"
          fi

          if git rev-parse --verify "$ROSTA_PS10_TAG^{commit}" >/dev/null 2>&1; then
            existing_ps10="$(git rev-parse "$ROSTA_PS10_TAG^{commit}")"
            expected_identity="$source_head"
            if [[ "${{ github.event_name }}" == "push" ]]; then expected_identity="$CANDIDATE_SHA"; fi
            test "$existing_ps10" = "$expected_identity" || {
              echo "PS10 tag already protects a different source identity: $existing_ps10" >&2
              exit 1
            }
          fi

          echo "source_head=$source_head" >> "$GITHUB_OUTPUT"
          echo "release_needed=true" >> "$GITHUB_OUTPUT"
          {
            echo "mode=release-candidate"
            echo "event=${{ github.event_name }}"
            echo "candidate=$CANDIDATE_SHA"
            echo "source_head=$source_head"
            echo "candidate_tree=$(git rev-parse "$CANDIDATE_SHA^{tree}")"
            echo "ps9_tag=$ROSTA_PS9_TAG"
            echo "ps9_accepted_sha=$ROSTA_PS9_ACCEPTED_SHA"
            echo "ps10_pre_release_merge=$ROSTA_PS10_PRE_RELEASE_MERGE_SHA"
            echo "ps10_original_source=$ROSTA_PS10_ORIGINAL_SOURCE_HEAD"
            echo "ps10_tag=$ROSTA_PS10_TAG"
          } | tee "$EVIDENCE_DIR/identity.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps10-validation-${{ github.run_id }}
          path: /tmp/rosta-ps10-validation/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90

  publish-release:
    name: publish-new-immutable-source-identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/integration/rosta-release-candidate' && needs.validate-source.outputs.release_needed == 'true'
    needs: [validate-source]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ github.sha }}
      SOURCE_HEAD: ${{ needs.validate-source.outputs.source_head }}
      EVIDENCE_DIR: /tmp/rosta-ps10-release/${{ github.run_id }}
    steps:
      - name: Checkout exact accepted merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.22

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: ps10-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Reproduce production frontend artifact
        shell: bash
        env:
          VITE_SITE_URL: https://rosta.shop
          VITE_API_URL: https://api.rosta.shop/api/v1
          VITE_PAYMENT_REDIRECT_HOSTS: rosta.shop,api.rosta.shop,zarinpal.com,www.zarinpal.com
          VITE_ALLOW_INDEXING: "true"
          NODE_ENV: production
          NITRO_PRESET: node-server
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = "$(git rev-parse "$SOURCE_HEAD^{tree}")"
          bun install --frozen-lockfile
          bun run audit:dependencies
          bun run build
          GITHUB_SHA="$CANDIDATE_SHA" bun run release:manifest -- .output "$EVIDENCE_DIR/frontend-release-manifest.json"
          mv ps10-sbom.spdx.json "$EVIDENCE_DIR/rosta-$CANDIDATE_SHA.spdx.json"

          workspace_status="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$workspace_status" > "$EVIDENCE_DIR/workspace-after-build.txt"
          if [[ -n "$workspace_status" ]]; then
            unexpected="$(printf '%s\n' "$workspace_status" | grep -vE '^ M src/routeTree\.gen\.ts$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected build workspace mutation:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            git checkout -- src/routeTree.gen.ts
          fi
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Seal PS10 release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch --force --tags origin
          test "$(git rev-parse "$ROSTA_PS9_TAG^{commit}")" = "$ROSTA_PS9_ACCEPTED_SHA"

          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$SOURCE_HEAD" \
            -f event=pull_request \
            -f per_page=100 \
            > "$EVIDENCE_DIR/source-head-workflow-runs.json"

          jq '[.workflow_runs[] | {name, id, run_number, head_sha, event, status, conclusion, html_url, created_at, updated_at}]' \
            "$EVIDENCE_DIR/source-head-workflow-runs.json" \
            > "$EVIDENCE_DIR/ps10-exact-head-workflows.json"
          rm "$EVIDENCE_DIR/source-head-workflow-runs.json"

          cat > "$EVIDENCE_DIR/ps10-final-acceptance.json" <<JSON
          {
            "schema": "rosta.ps10-final-acceptance.v2",
            "verdict": "PRE-SERVER GO",
            "merge_sha": "$CANDIDATE_SHA",
            "source_head_sha": "$SOURCE_HEAD",
            "tree_sha": "$tree",
            "previous_release_sha": "$ROSTA_PS9_ACCEPTED_SHA",
            "previous_release_tag": "$ROSTA_PS9_TAG",
            "pre_release_merge_sha": "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA",
            "release_tag": "$ROSTA_PS10_TAG",
            "workflow_run": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "source_tree_equals_merge_tree": true,
            "exact_head_workflow_matrix": "PASS",
            "publication_recovery": true,
            "real_server_activated": false,
            "external_provider_activation_claimed": false
          }
          JSON

          cat > "$EVIDENCE_DIR/PS10_FINAL_EVIDENCE.md" <<EOF
          # PS10 Final Evidence

          - Verdict: PRE-SERVER GO
          - Merge SHA: \`$CANDIDATE_SHA\`
          - Exact tested corrective source head: \`$SOURCE_HEAD\`
          - Tree SHA: \`$tree\`
          - Historical PS9 tag: \`$ROSTA_PS9_TAG\` -> \`$ROSTA_PS9_ACCEPTED_SHA\`
          - Pre-release PS10 merge (publication failed before tag): \`$ROSTA_PS10_PRE_RELEASE_MERGE_SHA\`
          - New PS10 tag: \`$ROSTA_PS10_TAG\`
          - Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Real server activated: no
          - External provider activation claimed: no
          EOF

          sha256sum \
            package.json bun.lock backend/composer.json backend/composer.lock \
            Dockerfile.production backend/Dockerfile.production \
            deploy/production/docker-compose.yml deploy/production/Caddyfile \
            docs/pre-server/PS10_FINAL_ACCEPTANCE.md \
            docs/pre-server/PS10_RELEASE_NOTES.md \
            docs/pre-server/PS10_RELEASE_RECOVERY.md \
            "$EVIDENCE_DIR/frontend-release-manifest.json" \
            "$EVIDENCE_DIR/rosta-$CANDIDATE_SHA.spdx.json" \
            "$EVIDENCE_DIR/workspace-after-build.txt" \
            "$EVIDENCE_DIR/ps10-exact-head-workflows.json" \
            "$EVIDENCE_DIR/ps10-final-acceptance.json" \
            > "$EVIDENCE_DIR/ps10-checksums.sha256"

          cat > "$EVIDENCE_DIR/freeze-proof.json" <<JSON
          {
            "schema": "rosta.ps10-freeze-proof.v2",
            "verdict": "PRE-SERVER GO",
            "tag": "$ROSTA_PS10_TAG",
            "merge_commit": "$CANDIDATE_SHA",
            "source_head": "$SOURCE_HEAD",
            "tree": "$tree",
            "previous_tag": "$ROSTA_PS9_TAG",
            "previous_commit": "$ROSTA_PS9_ACCEPTED_SHA",
            "pre_release_merge": "$ROSTA_PS10_PRE_RELEASE_MERGE_SHA",
            "workflow_run": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "real_server_activated": false
          }
          JSON

          if grep -R -E 'APP_KEY=|DB_PASSWORD=|MYSQL_ROOT_PASSWORD=|S3_SECRET_ACCESS_KEY=|PAYMENT_MERCHANT_ID=|KAVENEGAR_API_KEY=|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|\bsk-(proj-)?[A-Za-z0-9_-]{20,}' "$EVIDENCE_DIR"; then
            echo "Sensitive material entered PS10 release evidence." >&2
            exit 1
          fi

          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f ! -name 'ps10-release-assets.sha256' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/ps10-release-assets.sha256"

      - name: Create or verify PS10 release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin
          if git rev-parse --verify "$ROSTA_PS10_TAG^{commit}" >/dev/null 2>&1; then
            existing="$(git rev-parse "$ROSTA_PS10_TAG^{commit}")"
            test "$existing" = "$CANDIDATE_SHA" || {
              echo "PS10 release tag already protects a different SHA: $existing" >&2
              exit 1
            }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$ROSTA_PS10_TAG" "$CANDIDATE_SHA" \
              -m "ROSTA PS10 PRE-SERVER GO — launch capability closure"
            git push origin "refs/tags/$ROSTA_PS10_TAG"
          fi
          git fetch --force --tags origin
          test "$(git rev-parse "$ROSTA_PS10_TAG^{commit}")" = "$CANDIDATE_SHA"
          test "$(git rev-parse "$ROSTA_PS9_TAG^{commit}")" = "$ROSTA_PS9_ACCEPTED_SHA"

      - name: Publish release with sealed assets
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$ROSTA_PS10_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS10_TAG" --jq .tag_name)" = "$ROSTA_PS10_TAG"
            test "$(git rev-parse "$ROSTA_PS10_TAG^{commit}")" = "$CANDIDATE_SHA"
          else
            gh release create "$ROSTA_PS10_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "ROSTA Pre-server Source Release — 2026-09-02 (PS10)" \
              --notes-file docs/pre-server/PS10_RELEASE_NOTES.md
            gh release upload "$ROSTA_PS10_TAG" --repo "$GITHUB_REPOSITORY" "$EVIDENCE_DIR"/*
            gh release edit "$ROSTA_PS10_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ROSTA_PS10_TAG")"
          test "$(jq -r .draft <<< "$release_json")" = "false"
          test "$(jq -r .tag_name <<< "$release_json")" = "$ROSTA_PS10_TAG"
          for asset in freeze-proof.json ps10-final-acceptance.json ps10-exact-head-workflows.json ps10-checksums.sha256 ps10-release-assets.sha256 PS10_FINAL_EVIDENCE.md frontend-release-manifest.json workspace-after-build.txt "rosta-$CANDIDATE_SHA.spdx.json"; do
            jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' <<< "$release_json" >/dev/null
          done

      - name: Upload PS10 release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rosta-ps10-release-evidence-${{ github.run_id }}
          path: /tmp/rosta-ps10-release/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90