name: PS12 Bootstrap

on:
  push:
    branches: [phase/rosta-ps12-b2b-cafes-wholesale]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap(ps12)')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply PS12 source changes
        run: python3 scripts/ps12-bootstrap.py
      - name: Validate generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          while IFS= read -r file; do
            php -l "$file"
          done < <(git diff --name-only --diff-filter=ACM | grep '^backend/.*\.php$' || true)
      - name: Commit generated PS12 implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ps12): add cafe B2B wholesale marketplace core'
          git push origin "HEAD:${GITHUB_REF_NAME}"
