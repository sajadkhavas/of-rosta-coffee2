name: Rosta R2B1 Final Feature Gate

on:
  pull_request:
    branches: [integration/rosta-r-program]
    paths:
      - .github/workflows/r2b1-final-feature-gate.yml
      - .github/scripts/r2b1-final-session-repair.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rosta-r2b1-final-feature-gate
  cancel-in-progress: false

jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: program/r2b-php-quality
      EXPECTED_HEAD: 42620fe43c3ba73a40c7dd508a3df3bba4f0f512
      EVIDENCE_DIR: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1-final
      APP_ENV: testing
      APP_DEBUG: "false"
      LOG_CHANNEL: stack
      LOG_STACK: single
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      ROSTA_PAYMENT_ENABLED: "false"
      ROSTA_REFUND_ENABLED: "false"
      ROSTA_SMS_ENABLED: "false"
      ROSTA_MEDIA_UPLOADS_ENABLED: "false"
      COMPOSER_NO_INTERACTION: "1"
      COMPOSER_PROCESS_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: program/r2b-php-quality
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, redis, simplexml, sockets, sqlite3, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Verify exact baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test -s backend/composer.lock
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);'
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-before.sha256"
          printf 'head=%s\nphp=%s\n' "$(git rev-parse HEAD)" "$(php -r 'echo PHP_VERSION;')" | tee "$EVIDENCE_DIR/snapshot.txt"

      - name: Apply reviewed R2B1 repair chain
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in r2b-known-repairs.py r2b-feature-repairs.py r2b-feature-repairs-2.py r2b-feature-repairs-3.py r2b-feature-repairs-4.py; do
            git show "origin/automation/r2b-executor:.github/scripts/$script" > "/tmp/$script"
          done
          git show origin/automation/r2b1-final-executor:.github/scripts/r2b1-final-session-repair.py > /tmp/r2b1-final-session-repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/r2b-known-repairs.py')
          path.write_text(path.read_text().replace('pull_request:\\n', 'pull_request:\\\\n'))
          PY
          for script in r2b-known-repairs.py r2b-feature-repairs.py r2b-feature-repairs-2.py r2b-feature-repairs-3.py r2b-feature-repairs-4.py r2b1-final-session-repair.py; do
            python "/tmp/$script" 2>&1 | tee "$EVIDENCE_DIR/${script%.py}.log"
          done
          git diff --check

      - name: Install locked backend and boot
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          rm -rf vendor
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee "$EVIDENCE_DIR/composer-install.log"
          php artisan about 2>&1 | tee "$EVIDENCE_DIR/artisan-about.log"

      - name: Run contract audits and PHPUnit
        shell: bash
        working-directory: backend
        run: |
          set -Eeuo pipefail
          composer validate --strict 2>&1 | tee "$EVIDENCE_DIR/composer-validate.log"
          composer audit --locked 2>&1 | tee "$EVIDENCE_DIR/composer-audit.log"
          for gate in business checkout seo cooci-adoption fulfillment reviews-support media-storage openapi validation finance seller-operations admin-operations live-public staging; do
            composer "audit:$gate" 2>&1 | tee "$EVIDENCE_DIR/audit-$gate.log"
          done
          find . -maxdepth 1 -type f -name '*-audit.json' -print -exec cp {} "$EVIDENCE_DIR/" \;
          php artisan test --testsuite=Unit 2>&1 | tee "$EVIDENCE_DIR/tests-unit.log"
          php artisan test 2>&1 | tee "$EVIDENCE_DIR/tests-all.log"

      - name: Enforce product scope and push
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f backend/*-audit.json backend/.env
          sha256sum backend/composer.json backend/composer.lock | tee "$EVIDENCE_DIR/composer-after.sha256"
          cmp "$EVIDENCE_DIR/composer-before.sha256" "$EVIDENCE_DIR/composer-after.sha256"
          git diff --check
          tracked="$(git diff --name-only | sort)"
          untracked="$(git ls-files --others --exclude-standard | sort)"
          expected_tracked=$'.github/workflows/backend-ci.yml\nbackend/app/Http/Resources/AuthUserResource.php\nbackend/app/Http/Resources/CheckoutQuoteResource.php\nbackend/app/Http/Resources/ContentAuthorResource.php\nbackend/app/Http/Resources/ContentEntrySummaryResource.php\nbackend/app/Http/Resources/ProductVariantResource.php\nbackend/app/Http/Resources/SeoRedirectResource.php\nbackend/app/Http/Resources/StockLedgerEntryResource.php\nbackend/app/Providers/AppServiceProvider.php\nbackend/app/Services/Catalog/PublicCatalogService.php\nbackend/app/Services/Checkout/QuoteService.php\nbackend/app/Services/Content/ContentWriteService.php\nbackend/app/Support/SeoPath.php\nbackend/config/database.php\nbackend/scripts/audit-business-contract.php\nbackend/scripts/audit-commerce-openapi-drift.php\nbackend/scripts/audit-live-public-contract.php\nbackend/scripts/audit-validation-hardening.php\nbackend/tests/Feature/FulfillmentLifecycleTest.php\nbackend/tests/Feature/InquiryWorkflowTest.php\nbackend/tests/Support/AuthenticatesRecordedSession.php\nbackend/tests/TestCase.php'
          expected_untracked=$'backend/app/Http/Controllers/Controller.php\nbackend/app/Http/Resources/OkJsonResource.php\nbackend/scripts/route-contract-support.php'
          printf '%s\n' "$tracked" | tee "$EVIDENCE_DIR/tracked-files.txt"
          printf '%s\n' "$untracked" | tee "$EVIDENCE_DIR/untracked-files.txt"
          test "$tracked" = "$expected_tracked"
          test "$untracked" = "$expected_untracked"
          git config user.name "Rosta Program Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/backend-ci.yml backend/app backend/config/database.php backend/scripts backend/tests
          staged="$(git diff --cached --name-only | sort)"
          expected_staged=$'.github/workflows/backend-ci.yml\nbackend/app/Http/Controllers/Controller.php\nbackend/app/Http/Resources/AuthUserResource.php\nbackend/app/Http/Resources/CheckoutQuoteResource.php\nbackend/app/Http/Resources/ContentAuthorResource.php\nbackend/app/Http/Resources/ContentEntrySummaryResource.php\nbackend/app/Http/Resources/OkJsonResource.php\nbackend/app/Http/Resources/ProductVariantResource.php\nbackend/app/Http/Resources/SeoRedirectResource.php\nbackend/app/Http/Resources/StockLedgerEntryResource.php\nbackend/app/Providers/AppServiceProvider.php\nbackend/app/Services/Catalog/PublicCatalogService.php\nbackend/app/Services/Checkout/QuoteService.php\nbackend/app/Services/Content/ContentWriteService.php\nbackend/app/Support/SeoPath.php\nbackend/config/database.php\nbackend/scripts/audit-business-contract.php\nbackend/scripts/audit-commerce-openapi-drift.php\nbackend/scripts/audit-live-public-contract.php\nbackend/scripts/audit-validation-hardening.php\nbackend/scripts/route-contract-support.php\nbackend/tests/Feature/FulfillmentLifecycleTest.php\nbackend/tests/Feature/InquiryWorkflowTest.php\nbackend/tests/Support/AuthenticatesRecordedSession.php\nbackend/tests/TestCase.php'
          printf '%s\n' "$staged" | tee "$EVIDENCE_DIR/staged-files.txt"
          test "$staged" = "$expected_staged"
          git diff --cached --check
          git diff --cached --stat | tee "$EVIDENCE_DIR/diff-stat.txt"
          git commit -m "fix(backend): complete feature and runtime contracts"
          git push origin HEAD:"$TARGET_BRANCH"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/result-commit.txt"
          echo "ROSTA_R2B1_FEATURE_GATE_COMPLETE" | tee "$EVIDENCE_DIR/result.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosta-r2b1-final-evidence-${{ github.run_id }}
          path: /tmp/rosta-r2-evidence/${{ github.run_id }}/r2b1-final
          if-no-files-found: warn
          retention-days: 14
