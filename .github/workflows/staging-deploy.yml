name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA already frozen on integration/rosta-release-candidate
        required: true
      run_preflight:
        description: Run full host preflight before deploy
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rosta-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-and-accept
    runs-on: [self-hosted, linux, x64, rosta-staging]
    timeout-minutes: 90
    environment: staging
    steps:
      - name: Validate immutable release input
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be an exact lowercase 40-character commit SHA" >&2
            exit 1
          }

      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          clean: true

      - name: Resolve and verify immutable checked-out release
        shell: bash
        run: |
          set -Eeuo pipefail
          checked_out="$(git rev-parse HEAD)"
          test "$checked_out" = "${{ inputs.release_sha }}"
          git merge-base --is-ancestor "$checked_out" origin/integration/rosta-release-candidate
          echo "ROSTA_RELEASE_TAG=$checked_out" >> "$GITHUB_ENV"

      - name: Protect deployment scripts
        run: chmod +x deploy/staging/*.sh

      - name: Run host preflight
        if: ${{ inputs.run_preflight }}
        env:
          ROSTA_FRONTEND_ENV_PATH: /etc/rosta/staging/frontend.env
          ROSTA_BACKEND_ENV_PATH: /etc/rosta/staging/backend.env
          ROSTA_STATE_DIR: /var/lib/rosta/staging
        run: deploy/staging/preflight.sh

      - name: Deploy immutable release and execute acceptance
        env:
          ROSTA_FRONTEND_ENV_PATH: /etc/rosta/staging/frontend.env
          ROSTA_BACKEND_ENV_PATH: /etc/rosta/staging/backend.env
          ROSTA_STATE_DIR: /var/lib/rosta/staging
        run: deploy/staging/deploy.sh

      - name: Collect redacted acceptance evidence
        if: always()
        env:
          ROSTA_FRONTEND_ENV_PATH: /etc/rosta/staging/frontend.env
          ROSTA_BACKEND_ENV_PATH: /etc/rosta/staging/backend.env
          ROSTA_STATE_DIR: /var/lib/rosta/staging
        run: |
          mkdir -p .staging-artifacts
          if [ -f /var/lib/rosta/staging/reports/latest.json ]; then
            cp /var/lib/rosta/staging/reports/latest.json .staging-artifacts/acceptance.json
            cp /var/lib/rosta/staging/reports/latest.json.sha256 .staging-artifacts/acceptance.json.sha256
          fi
          bash -c 'source deploy/staging/lib.sh; load_staging_environment; rosta_compose ps' \
            > .staging-artifacts/compose-ps.txt || true

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.run_id }}
          path: .staging-artifacts
          if-no-files-found: warn
          retention-days: 30
