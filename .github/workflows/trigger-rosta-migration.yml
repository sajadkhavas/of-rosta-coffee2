name: Trigger Rosta migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-rosta-migration.yml

permissions:
  contents: write

jobs:
  migrate-to-safe-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/migrate-phases-1-4
          fetch-depth: 0

      - name: Clone completed source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch agent/phase-3-identity-account \
            "https://x-access-token:${GH_TOKEN}@github.com/sajadkhavas/remix-of-of-rosta-coffee2.git" \
            /tmp/rosta-completed

      - name: Synchronize completed snapshot
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/trigger-rosta-migration.yml' \
            /tmp/rosta-completed/ ./
          rm -f MIGRATION_TEST.md
          rm -rf migration

      - name: Commit and push safe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit -m "chore(migration): port completed phases 1-4 to original repo"
          git push origin HEAD:agent/migrate-phases-1-4
