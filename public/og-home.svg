      <stop offset=".55" stop-color="#1A0A00" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0A0400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8D5B7"/>
      <stop offset=".45" stop-color="#C8965A"/>
      <stop offset="1" stop-color="#704019"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0A0400"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g opacity=".16" fill="none" stroke="#C8965A">
