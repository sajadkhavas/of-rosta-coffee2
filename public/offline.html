<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0400" />
    <meta name="robots" content="noindex,nofollow" />
    <title>رستا آفلاین است</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0400; color: #f7f0e6; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 20%, rgba(200,150,90,.16), transparent 34%), #0a0400; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #4a2c0a; border-radius: 24px; background: #1a0a00; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; border-radius: 18px; background: rgba(200,150,90,.12); color: #c8965a; font-size: 30px; }
      h1 { margin: 22px 0 0; font-size: 28px; }
      p { margin: 14px 0 0; color: #e8d5b7; line-height: 2; }
      a { display: inline-grid; min-height: 48px; margin-top: 24px; padding: 0 24px; place-items: center; border-radius: 12px; background: #c8965a; color: #0a0400; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">☕</div>
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>برای نمایش قیمت، موجودی، حساب کاربری و سفارش‌ها به اتصال امن سرور نیاز است. پس از برقراری اینترنت دوباره تلاش کنید.</p>
      <a href="/">تلاش مجدد</a>
    </main>
  </body>
</html>
