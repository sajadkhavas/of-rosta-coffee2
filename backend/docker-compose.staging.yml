x-rosta-app: &rosta-app
  image: rosta-api:${ROSTA_IMAGE_TAG:-staging}
  build:
    context: .
    dockerfile: Dockerfile.production
    target: app
  env_file:
    - .env.staging
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - rosta_storage:/var/www/html/storage
    - rosta_cache:/var/www/html/bootstrap/cache
  networks:
    - backend
  security_opt:
    - no-new-privileges:true

services:
  app:
    <<: *rosta-app
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: rosta-api-web:${ROSTA_IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile.production
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROSTA_API_PORT:-8080}:8080"
    volumes:
      - rosta_storage:/var/www/html/storage:ro
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/live || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *rosta-app
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "redis",
        "--queue=critical,default,notifications",
        "--sleep=1",
        "--tries=3",
        "--backoff=5",
        "--timeout=90",
        "--max-time=3600",
      ]
    stop_grace_period: 2m

  scheduler:
    <<: *rosta-app
    command: ["php", "artisan", "schedule:work"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in backend/.env.staging}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in backend/.env.staging}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env.staging}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in backend/.env.staging}
    volumes:
      - rosta_mysql:/var/lib/mysql
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env.staging}",
      ]
    volumes:
      - rosta_redis:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

networks:
  frontend:
  backend:
    internal: true

volumes:
  rosta_mysql:
  rosta_redis:
  rosta_storage:
  rosta_cache:
